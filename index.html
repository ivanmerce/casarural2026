<style>
/* Layout: una columna móvil (máx. 560px) sobre un fondo luminoso con manchas de color y red de nodos; todo el contenido en paneles de cristal esmerilado; barra de pestañas de cristal fija abajo.
   Personalizable por cada persona: tema, color de acento, fondo, intensidad del cristal y tamaño de texto (JS escribe --accent-base, --glass-a, --blur y la escala). */
:root {
  --accent-base: #C4112F;                 /* carmesí del folleto (por defecto) */
  --accent: var(--accent-base);
  --accent-soft: color-mix(in srgb, var(--accent) 13%, transparent);
  --on-accent: #FFFFFF;
  --bg: #F3EEEB;
  --bg-2: #E9E1DC;
  --ink: #1C1614;
  --muted: #6A5E58;
  --line: rgba(60, 35, 28, .12);
  --glass-a: .62;
  --glass: rgba(255, 255, 255, var(--glass-a));
  --glass-strong: rgba(255, 255, 255, calc(var(--glass-a) + .22));
  --glass-line: rgba(255, 255, 255, .75);
  --blur: 18px;
  --surface-2: rgba(120, 85, 60, .08);   /* madera velada */
  --olive: #55663F; --olive-soft: rgba(85, 102, 63, .13);
  --wood: #94643F;
  --ok: #2E7A48; --warn: #A2650F; --warn-soft: rgba(214, 150, 40, .16);
  --blob-1: color-mix(in srgb, var(--accent) 30%, transparent);
  --blob-2: rgba(120, 150, 90, .32);
  --blob-3: rgba(200, 150, 100, .30);
  --net: color-mix(in srgb, var(--accent) 40%, transparent);
  --f1: #C4112F; --f2: #55663F; --f3: #A86A12; --f4: #3F5A7A;
  --overlay-ink: #FFFFFF;
  --shadow: 0 1px 1px rgba(60, 30, 20, .04), 0 10px 30px rgba(60, 30, 20, .08);
  --font-display: 'Bricolage Grotesque', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --r: 22px; --r-sm: 14px;
  --tap: 48px;
  --nav-h: 70px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: color-mix(in srgb, var(--accent-base) 75%, white);
    --bg: #15100F; --bg-2: #1D1614; --ink: #F3ECE8; --muted: #AE9F97; --line: rgba(255, 240, 230, .10);
    --glass: rgba(34, 26, 24, var(--glass-a)); --glass-strong: rgba(40, 30, 28, calc(var(--glass-a) + .25)); --glass-line: rgba(255, 255, 255, .10);
    --surface-2: rgba(255, 220, 190, .06);
    --olive: #A3B880; --olive-soft: rgba(163, 184, 128, .14); --wood: #CF9A6A;
    --ok: #5CC082; --warn: #E3A94A; --warn-soft: rgba(227, 169, 74, .14);
    --blob-1: color-mix(in srgb, var(--accent) 28%, transparent); --blob-2: rgba(110, 140, 80, .22); --blob-3: rgba(160, 110, 70, .22);
    --f1: #EC4A63; --f2: #A3B880; --f3: #E3A94A; --f4: #86A8D0;
    --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: color-mix(in srgb, var(--accent-base) 75%, white);
  --bg: #15100F; --bg-2: #1D1614; --ink: #F3ECE8; --muted: #AE9F97; --line: rgba(255, 240, 230, .10);
  --glass: rgba(34, 26, 24, var(--glass-a)); --glass-strong: rgba(40, 30, 28, calc(var(--glass-a) + .25)); --glass-line: rgba(255, 255, 255, .10);
  --surface-2: rgba(255, 220, 190, .06);
  --olive: #A3B880; --olive-soft: rgba(163, 184, 128, .14); --wood: #CF9A6A;
  --ok: #5CC082; --warn: #E3A94A; --warn-soft: rgba(227, 169, 74, .14);
  --blob-1: color-mix(in srgb, var(--accent) 28%, transparent); --blob-2: rgba(110, 140, 80, .22); --blob-3: rgba(160, 110, 70, .22);
  --f1: #EC4A63; --f2: #A3B880; --f3: #E3A94A; --f4: #86A8D0;
  --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-size: 100%; }
html[data-size="l"] { font-size: 112.5%; }
html[data-size="xl"] { font-size: 125%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
/* Fondo ambiental: manchas de color (cristal) o liso */
.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; background:
  radial-gradient(38rem 30rem at 12% -6%, var(--blob-1), transparent 70%),
  radial-gradient(34rem 28rem at 105% 22%, var(--blob-2), transparent 70%),
  radial-gradient(40rem 30rem at 30% 108%, var(--blob-3), transparent 70%),
  linear-gradient(180deg, var(--bg), var(--bg-2)); }
.ambient canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
html[data-bg="plain"] .ambient { background: var(--bg); }
html[data-bg="plain"] .ambient canvas { display: none; }
html[data-bg="glass"] .ambient canvas { display: none; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 1.6rem; font-weight: 800; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.eyebrow { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.accent { color: var(--accent); }

/* Cristal: base común */
.glass { background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.5); backdrop-filter: blur(var(--blur)) saturate(1.5); border: 1px solid var(--glass-line); box-shadow: var(--shadow); }

/* ---------- Shell ---------- */
.app { max-width: 560px; margin: 0 auto; padding-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px; padding: 8px max(16px, calc(50% - 264px)); margin: 0 auto;
  background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.5); backdrop-filter: blur(var(--blur)) saturate(1.5);
  border-bottom: 1px solid var(--glass-line);
}
.wordmark { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 0; min-height: var(--tap); color: var(--ink); }
.wordmark b { font-family: var(--font-display); font-weight: 800; font-size: 1.12rem; letter-spacing: -.01em; }
.wordmark i { font-style: normal; color: var(--accent); }
.topbar .sp { flex: 1; }
.me-btn { display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 4px 12px 4px 4px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass-strong); }
.me-btn .role { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass-strong); }
.ico { width: 22px; height: 22px; flex: none; }

main { padding: 0 16px; }
.view { display: flex; flex-direction: column; gap: 16px; animation: viewIn .3s ease both; }
@keyframes viewIn { from { opacity: .35; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 18px; }
.view-head p { margin-top: 4px; }

/* ---------- Hero de cristal con red de nodos ---------- */
.hero { position: relative; margin-top: 14px; padding: 22px 18px 20px; border-radius: 28px; overflow: hidden; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero > *:not(canvas) { position: relative; }
.hero .kicker { color: var(--accent); font-weight: 800; font-family: var(--font-display); font-size: 1.05rem; }
.hero h1 { font-size: clamp(2.3rem, 11vw, 3.4rem); font-weight: 800; margin-top: 6px; letter-spacing: -0.03em; }
.hero h1 span { color: var(--accent); }
.hero .place { color: var(--muted); margin-top: 6px; display: flex; gap: 6px; align-items: center; }
.count { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
.count div { background: var(--glass-strong); border: 1px solid var(--glass-line); border-radius: var(--r-sm); padding: 10px 4px; text-align: center; }
.count b { display: block; font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.count span { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.hero .live { margin-top: 16px; font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; }

/* ---------- Tarjetas ---------- */
.card { border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0;
  background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.5); backdrop-filter: blur(var(--blur)) saturate(1.5);
  border: 1px solid var(--glass-line); box-shadow: var(--shadow); }
.card.alert { background: color-mix(in srgb, var(--warn-soft) 100%, var(--glass)); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.card.star { border: 2px solid color-mix(in srgb, var(--accent) 70%, transparent); }
.card.wood { background: color-mix(in srgb, var(--wood) 9%, var(--glass)); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.link { color: var(--accent); font-weight: 700; text-decoration: none; background: none; border: 0; padding: 6px 0; min-height: 40px; display: inline-flex; align-items: center; gap: 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 > * { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.wrap { flex-wrap: wrap; }
.divider { height: 1px; background: var(--line); }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 18px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass-strong); font-weight: 700; transition: transform .12s ease, background .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.danger { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: transparent; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; }
.fab { position: fixed; right: max(16px, calc(50% - 264px)); bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 25; width: 60px; height: 60px; border-radius: 20px; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 10px 28px color-mix(in srgb, var(--accent) 45%, transparent); }
.fab .ico { width: 28px; height: 28px; }

/* ---------- Chips, pills, segmentos ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-weight: 600; font-size: .95rem; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.red { background: var(--accent-soft); color: var(--accent); }
.pill.olive { background: var(--olive-soft); color: var(--olive); }
.pill.est { background: transparent; border: 1px dashed var(--warn); color: var(--warn); }
.pill.pend { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.seg { display: flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { flex: 1; min-height: 42px; border: 0; border-radius: 999px; background: transparent; font-weight: 700; font-size: .92rem; color: var(--muted); padding: 0 8px; }
.seg button[aria-pressed="true"] { background: var(--glass-strong); color: var(--ink); box-shadow: var(--shadow); }

/* ---------- Avatares ---------- */
.av { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); font-size: .95rem; color: #fff; background: var(--f1); border: 0; }
.av { overflow: hidden; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
.av.sm { width: 28px; height: 28px; font-size: .78rem; }
.av.lg { width: 48px; height: 48px; font-size: 1.2rem; }
.av.f1 { background: var(--f1); } .av.f2 { background: var(--f2); } .av.f3 { background: var(--f3); } .av.f4 { background: var(--f4); }
.fam-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.fam-dot.f1 { background: var(--f1); } .fam-dot.f2 { background: var(--f2); } .fam-dot.f3 { background: var(--f3); } .fam-dot.f4 { background: var(--f4); }
.avs { display: flex; } .avs .av { margin-left: -7px; box-shadow: 0 0 0 2px var(--bg); } .avs .av:first-child { margin-left: 0; }

/* ---------- Selector de día ---------- */
.days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.day { min-height: 64px; border-radius: var(--r-sm); border: 1px solid var(--glass-line); background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; position: relative; }
.day small { font-weight: 600; color: var(--muted); font-size: .72rem; }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day[aria-pressed="true"] small { color: inherit; opacity: .75; }
.day.star::after { content: ''; position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* ---------- Comidas ---------- */
.meal .slot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.meal .dishes { margin: 0; padding-left: 18px; }
.marc-line { display: flex; gap: 10px; align-items: flex-start; background: var(--olive-soft); border-radius: var(--r-sm); padding: 10px 12px; font-size: .95rem; }
.marc-line b { color: var(--olive); white-space: nowrap; }
.meal-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.diners { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-family: var(--font-display); font-size: 1.1rem; }

/* ---------- Compra ---------- */
.progress { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.cat-head { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.items { display: flex; flex-direction: column; border-radius: var(--r); overflow: hidden;
  background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.5); backdrop-filter: blur(var(--blur)) saturate(1.5); border: 1px solid var(--glass-line); box-shadow: var(--shadow); }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 64px; border-top: 1px solid var(--line); transition: background .3s; }
.item:first-child { border-top: 0; }
.item .body { flex: 1; min-width: 0; background: none; border: 0; text-align: left; padding: 4px 0; }
.item .name { font-weight: 700; display: block; overflow-wrap: anywhere; }
.item .meta { font-size: .84rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.item .price { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem; white-space: nowrap; }
.item .price small { display: block; font-weight: 600; color: var(--warn); font-size: .7rem; letter-spacing: .04em; }
.item.done .name { text-decoration: line-through; text-decoration-color: var(--accent); text-decoration-thickness: 2px; color: var(--muted); }
.item.casa .name { color: var(--muted); }
.check { flex: none; width: 46px; height: 46px; border-radius: 14px; border: 2px solid var(--line); background: var(--glass-strong); display: grid; place-items: center; position: relative; transition: background .2s, border-color .2s; }
.check svg { width: 24px; height: 24px; stroke: var(--on-accent); stroke-width: 3.2; fill: none; stroke-dasharray: 30; stroke-dashoffset: 30; transition: stroke-dashoffset .35s ease .05s; }
.check.on { background: var(--accent); border-color: var(--accent); }
.check.on svg { stroke-dashoffset: 0; }
.check.home { background: var(--olive-soft); border-color: var(--olive); }
.check.home svg { stroke: var(--olive); stroke-dashoffset: 0; }
.check.pop { animation: pop .42s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
.burst { position: absolute; inset: -6px; border-radius: 18px; border: 2px solid var(--accent); animation: burst .5s ease-out forwards; pointer-events: none; }
@keyframes burst { from { opacity: .9; transform: scale(.8); } to { opacity: 0; transform: scale(1.5); } }
.super .item { min-height: 78px; }
.super .item .name { font-size: 1.18rem; }

/* ---------- Barra inferior ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 0 10px calc(8px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }

  background: var(--glass-strong); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); border: 1px solid var(--glass-line); box-shadow: 0 10px 30px rgba(40, 20, 15, .14); }

@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .3s cubic-bezier(.2, .9, .3, 1) both;
  background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5); border: 1px solid var(--glass-line); }

.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-size: .8rem; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.field input, .field select, .field textarea { min-height: var(--tap); border-radius: 12px; border: 1px solid var(--line); background: var(--glass-strong); padding: 10px 12px; width: 100%; }
.field textarea { min-height: 88px; resize: vertical; }
.sheet-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet-actions .btn { flex: 1; }

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 14px 12px 16px; display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 32px); width: max-content; box-shadow: var(--shadow); animation: toastIn .3s cubic-bezier(.2, .9, .3, 1) both; font-weight: 600; }

/* ---------- Vacíos ---------- */

.empty .ico { width: 56px; height: 56px; color: var(--wood); }
.empty b { color: var(--ink); font-family: var(--font-display); font-size: 1.2rem; }

/* ---------- Easter eggs ---------- */
.fx { position: fixed; inset: 0; z-index: 80; pointer-events: none; }

.egg-veil { position: fixed; inset: 0; z-index: 79; background: rgba(20, 10, 8, .5); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fade .3s both; }
.egg-msg { position: fixed; inset: 0; z-index: 81; display: grid; place-items: center; text-align: center; pointer-events: none; padding: 16px; }
.egg-msg .inner { animation: eggIn .6s cubic-bezier(.3, 1.4, .5, 1) both; }
.egg-msg h2 { font-size: clamp(2.6rem, 14vw, 5rem); color: var(--overlay-ink); text-shadow: 0 4px 30px rgba(0, 0, 0, .45); }
.egg-msg p { color: var(--overlay-ink); font-weight: 700; margin-top: 10px; text-shadow: 0 2px 12px rgba(0, 0, 0, .5); max-width: 32ch; margin-inline: auto; }
.egg-msg .eleven { font-family: var(--font-display); font-weight: 800; font-size: min(62vw, 360px); line-height: .85; color: var(--accent); text-shadow: 0 10px 60px color-mix(in srgb, var(--accent) 50%, transparent); }
@keyframes eggIn { from { transform: scale(.4); opacity: 0; } }
.trophy .ico { width: 150px; height: 150px; color: #E8B64A; filter: drop-shadow(0 8px 30px rgba(232, 182, 74, .55)); animation: spin 1.4s cubic-bezier(.3, 1.4, .5, 1) both; }
@keyframes spin { from { transform: rotateY(540deg) scale(.3); } }
.bubble { position: fixed; z-index: 70; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .85); background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, .95), rgba(160, 200, 255, .28) 40%, rgba(255, 150, 200, .16) 70%, transparent); box-shadow: inset 0 0 12px rgba(255, 255, 255, .5), 0 2px 10px rgba(80, 120, 200, .15); animation: rise linear forwards; }
@keyframes rise { to { transform: translateY(-120vh) translateX(var(--dx, 0)); } }
.bubble.popped { animation: popb .25s ease-out forwards; }
@keyframes popb { to { transform: scale(1.7); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :root { --glass: color-mix(in srgb, var(--bg) 92%, white); }
}

<body>
<div class="ambient" aria-hidden="true"><canvas id="ambNet"></canvas></div>
<header class="topbar" id="top"></header>
<div class="app"><main id="main" aria-live="polite"></main></div>
<nav class="nav" id="nav" aria-label="Secciones"></nav>
<noscript><p style="padding:24px">Activa JavaScript para usar el Cónclave.</p></noscript>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* =====================================================================
   Cónclave · Lógica pura (sin DOM). Testeable con node: tests/logic.test.js
   ===================================================================== */
var L = (function () {
  var eur = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var num = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 2 });

  /* "1.234,56 €": Intl en es-ES no pone punto de miles con 4 cifras, lo forzamos */
  function money(v) {
    if (v == null || isNaN(v)) return '—';
    var s = eur.format(Math.round(v * 100) / 100);
    return s.replace(/^(-?)(\d)(\d{3}),/, '$1$2.$3,');
  }
  function n(v) { return num.format(v); }
  function ddmm(iso) { var d = iso.slice(0, 10).split('-'); return d[2] + '/' + d[1]; }
  function r2(v) { return Math.round(v * 100) / 100; }

  /* ---- Asistencia ---- */
  function attends(S, personId, mealId) {
    /* prioridad: excepción de esa comida > confirmación del día > valor por defecto de la persona */
    var o = S.attendance && S.attendance[mealId];
    if (o && personId in o) return !!o[personId];
    var m = S.meals.find(function (x) { return x.id === mealId; });
    var st = m ? dayStatus(S, personId, m.day) : 'pend';
    if (st === 'si') return true;
    if (st === 'no') return false;
    var p = S.people.find(function (x) { return x.id === personId; });
    return !!(p && p.attends);
  }
  /* ---- Confirmación por día: 'si' · 'no' · 'pend' ---- */
  function dayStatus(S, personId, day) {
    var c = S.dayConfirm && S.dayConfirm[personId];
    return (c && c[day]) || 'pend';
  }
  function dayCount(S, day) {
    var r = { si: 0, no: 0, pend: 0, pendYes: 0, total: S.people.length };
    S.people.forEach(function (p) {
      var st = dayStatus(S, p.id, day); r[st]++;
      if (st === 'pend' && p.attends) r.pendYes++;
    });
    r.expected = r.si + r.pendYes;           /* los que contamos para cantidades */
    return r;
  }
  /* Cantidad sugerida: los ingredientes con "per" están pensados para N comensales */
  function suggestQty(S, item) {
    if (!item.per || !item.meals || !item.meals.length) return null;
    var n = Math.max.apply(null, item.meals.map(function (id) { return diners(S, id).length; }));
    if (!n || n === item.per) return null;
    var q = item.qty * n / item.per;
    q = item.qty >= 10 || /u$|^u|latas|canelones|láminas/.test(item.unit) ? Math.ceil(q) : Math.ceil(q * 10) / 10;
    return q === item.qty ? null : { n: n, qty: q };
  }
  function diners(S, mealId) {
    return S.people.filter(function (p) { return attends(S, p.id, mealId); });
  }
  function mealsAttended(S, personId) {
    return S.meals.filter(function (m) { return attends(S, personId, m.id); }).length;
  }

  /* ---- Reparto ---- */
  function weightOf(S, p) {
    var w = (S.split && S.split.w) || { adulto: 1, menor: 0.5, bebe: 0 };
    return w[p.kind] != null ? w[p.kind] : 1;
  }
  /* devuelve { familyId: fracción 0..1 } */
  function shares(S) {
    var mode = (S.split && S.split.mode) || 'ponderado';
    var units = {};
    S.families.forEach(function (f) { units[f.id] = 0; });
    if (mode === 'familia') {
      S.families.forEach(function (f) {
        var any = S.people.some(function (p) { return p.family === f.id && mealsAttended(S, p.id) > 0; });
        units[f.id] = any ? 1 : 0;
      });
    } else {
      S.people.forEach(function (p) {
        var m = mealsAttended(S, p.id);
        var w = mode === 'persona' ? 1 : weightOf(S, p);
        units[p.family] = (units[p.family] || 0) + w * m;
      });
    }
    var tot = Object.keys(units).reduce(function (a, k) { return a + units[k]; }, 0);
    var out = {};
    Object.keys(units).forEach(function (k) { out[k] = tot ? units[k] / tot : 0; });
    return { share: out, units: units };
  }

  /* gastos comunes por familia. useEst: simulación con precios ESTIMADOS */
  function paidBy(S, useEst) {
    var paid = {};
    S.families.forEach(function (f) { paid[f.id] = 0; });
    S.ingredients.forEach(function (i) {
      if ((i.split || 'comun') !== 'comun') return;
      if (i.status === 'casa') return;
      var v = null;
      if (useEst) v = (i.cost != null ? i.cost : i.est);
      else if (i.status === 'comprado') v = i.cost;
      if (v && i.family) paid[i.family] += v;
    });
    (S.expenses || []).forEach(function (e) {
      if ((e.split || 'comun') !== 'comun' || e.kind === 'aportacion') return;
      if (e.payer && e.amount) paid[e.payer] += e.amount;
    });
    Object.keys(paid).forEach(function (k) { paid[k] = r2(paid[k]); });
    return paid;
  }

  /* mínimo número de transferencias (voraz: mayor deudor paga a mayor acreedor) */
  function settle(balances) {
    var debt = [], cred = [];
    Object.keys(balances).forEach(function (k) {
      var v = r2(balances[k]);
      if (v < -0.005) debt.push({ id: k, v: -v });
      else if (v > 0.005) cred.push({ id: k, v: v });
    });
    var tx = [];
    while (debt.length && cred.length) {
      debt.sort(function (a, b) { return b.v - a.v; });
      cred.sort(function (a, b) { return b.v - a.v; });
      var d = debt[0], c = cred[0];
      var amt = r2(Math.min(d.v, c.v));
      if (amt > 0) tx.push({ from: d.id, to: c.id, amount: amt });
      d.v = r2(d.v - amt); c.v = r2(c.v - amt);
      if (d.v <= 0.005) debt.shift();
      if (c.v <= 0.005) cred.shift();
    }
    return tx;
  }

  /* Aportaciones: dinero que una familia pone "de regalo" para el bote común.

/* ===================== Confirmación de asistencia por día ===================== */
var CONF = { si: ['✓', 'Voy'], no: ['✕', 'No voy'], pend: ['?', 'Sin confirmar'] };

}
function daySummary() {
  return '<div class="daysum">' + S.days.map(function (d) {
    var c = L.dayCount(S, d.k);
    return '<div' + (d.star ? ' class="star"' : '') + '><small>' + esc(d.short) + '</small><b class="num">' + c.expected + '</b><span class="num">' + c.si + ' ✓ · ' + c.pend + ' ? · ' + c.no + ' ✕</span></div>';

function pendingConfirmations() {

}

    '<p class="small muted">' + pname(p.id) + ', toca cada día hasta que quede como es. Con esto salen los comensales y las cantidades de la compra.</p>' +
    '<div class="conf-row">' + S.days.map(function (d) { return confBtn(p.id, d.k); }).join('') + '</div>' +
    '<div class="divider"></div><span class="eyebrow">Previstos por día</span>' + daySummary() +
    (pend ? '<p class="small"><span class="pill warn">' + pend + ' confirmaciones pendientes</span> Mientras tanto contamos a los habituales.</p>' : '<p class="small"><span class="pill ok">Todo confirmado</span> Planning y cantidades cerrados.</p>') +
    '</section>';
}
VIEWS.asistencia = function () {

    '<div class="stack small">' + S.days.map(function (d) {
      var ms = S.meals.filter(function (m) { return m.day === d.k && m.mode === 'comun'; });
      if (!ms.length) return '';
      return '<div class="row wrap"><b style="min-width:58px">' + esc(d.short) + '</b>' + ms.map(function (m) { return '<span class="pill">' + slotName(m.slot) + ' · ' + L.diners(S, m.id).length + '</span>'; }).join('') + '</div>';
    }).join('') + '</div></section>';
  h += '<div class="conf-legend small muted"><span><b class="conf-dot si">✓</b> Voy</span><span><b class="conf-dot no">✕</b> No voy</span><span><b class="conf-dot pend">?</b> Sin confirmar (contamos a los habituales)</span></div>';

function applySuggestion(i) {
  var s = L.suggestQty(S, i); if (!s) return false;

}

    return {
      version: 'cloud', trip: kv.trip || {}, days: kv.days || [], slots: SLOTS,
      families: d.families.slice().sort(function (a, b) { return a.sort - b.sort; }).map(function (r) { return { id: r.id, name: r.name, short: r.short, color: r.color, note: r.note }; }),
      people: d.people.slice().sort(function (a, b) { return a.sort - b.sort; }).map(function (r) { return { id: r.id, name: r.name, family: r.family_id, age: r.age, approx: r.age_approx, kind: r.kind, role: r.role, email: r.email, attends: r.attends_default, pend: r.pending, note: r.note, sort: r.sort, avatar: r.avatar }; }),
      pendingPeople: [],
      homes: d.homes.map(function (r) { return { id: r.id, name: r.name, beds: r.beds, free: r.free, rooms: r.rooms, note: r.note, proposal: r.proposal || [] }; }),
      meals: d.meals.map(function (r) { return { id: r.id, day: r.day, slot: r.slot, time: hm(r.time_override), mode: r.mode, title: r.title, dishes: r.dishes || [], cook: r.cook_family_id, marc: r.marc_menu, notes: r.notes, star: r.star }; }),
      ingredients: d.ingredients.slice().sort(function (a, b) { return a.sort - b.sort; }).map(function (r) { return { id: r.id, name: r.name, cat: r.category, qty: num(r.qty), unit: r.unit, qtyEst: r.qty_estimated, family: r.family_id, status: r.status, split: r.split, cost: num(r.cost), est: num(r.est_cost), per: r.per_diners, sug: r.suggested, note: r.note, sort: r.sort, meals: im[r.id] || [] }; }),
      expenses: d.expenses.map(function (r) { return { id: r.id, concept: r.concept, amount: num(r.amount), payer: r.payer_family_id, split: r.split, kind: r.kind, date: r.spent_on }; }),
      house: { total: num(st.house_total), payer: st.house_payer_family_id, cancel: kv.cancel || [], payments: d.house_payments.slice().sort(function (a, b) { return a.id.localeCompare(b.id); }).map(function (r) { return { id: r.id, label: r.label, amount: num(r.amount), due: r.due_on, date: r.paid_on, paid: r.paid, note: r.note }; }) },
      tax: { perNight: num(st.tax_per_night), nights: st.tax_nights, minAge: st.tax_min_age, payer: st.tax_payer_family_id, note: kv.taxNote || '' },
      split: { mode: st.split_mode, w: { adulto: num(st.w_adulto), menor: num(st.w_menor), bebe: num(st.w_bebe) } },
      activities: d.activities.map(function (r) { return { id: r.id, day: r.day, start: hm(r.start_time), dur: r.duration_min, title: r.title, place: r.place, where: r.where_text, travel: r.travel, age: r.age, marc: r.marc, owner: r.owner_person_id, planB: r.plan_b, desc: r.description, star: r.star, tournament: r.is_tournament }; }),
      paidOptions: kv.paidOptions || [],
      tournament: { name: kv.tournamentName || 'Torneo', rounds: rounds.map(function (r) { return r || []; }) },
      weather: old.weather || kv.weather || { days: [], climate: {} },
      attendance: att, dayConfirm: dc, votes: votes, fumataShown: old.fumataShown
    };
  }

  /* ---------- S → filas por tabla ---------- */
  function rows(S) {
    var out = {};
    out.settings = [{ id: 1, house_total: S.house.total, house_payer_family_id: S.house.payer, split_mode: S.split.mode, w_adulto: S.split.w.adulto, w_menor: S.split.w.menor, w_bebe: S.split.w.bebe, tax_per_night: S.tax.perNight, tax_nights: S.tax.nights, tax_min_age: S.tax.minAge, tax_payer_family_id: S.tax.payer }];
    out.app_config = [{ key: 'trip', value: S.trip }];
    out.people = S.people.map(function (p, i) { return { id: p.id, family_id: p.family, name: p.name, age: p.age, age_approx: !!p.approx, kind: p.kind, role: p.role, email: p.email || null, attends_default: !!p.attends, pending: !!p.pend, note: p.note || null, avatar: p.avatar || null, sort: p.sort != null ? p.sort : i }; });
    out.meals = S.meals.map(function (m) { return { id: m.id, day: m.day, slot: m.slot, time_override: m.time || null, mode: m.mode, title: m.title, dishes: m.dishes, cook_family_id: m.cook || null, marc_menu: m.marc || null, notes: m.notes || null, star: !!m.star }; });
    out.ingredients = S.ingredients.map(function (i, k) { return { id: i.id, name: i.name, category: i.cat, qty: i.qty, unit: i.unit, qty_estimated: !!i.qtyEst, family_id: i.family || null, status: i.status, split: i.split || 'comun', cost: i.cost, est_cost: i.est, per_diners: i.per || null, suggested: !!i.sug, note: i.note || null, sort: i.sort != null ? i.sort : 1000 + k }; });
    out.activities = S.activities.map(function (a) { return { id: a.id, day: a.day, start_time: a.start, duration_min: a.dur, title: a.title, place: a.place || 'finca', where_text: a.where || null, travel: a.travel || null, age: a.age || null, marc: a.marc, owner_person_id: a.owner || null, plan_b: a.planB || null, description: a.desc || null, star: !!a.star, is_tournament: !!a.tournament }; });
    out.expenses = S.expenses.map(function (e) { return { id: e.id, concept: e.concept, amount: e.amount, payer_family_id: e.payer, split: e.split || 'comun', kind: e.kind || 'gasto', spent_on: e.date || new Date().toISOString().slice(0, 10) }; });
    out.house_payments = S.house.payments.map(function (p) { return { id: p.id, label: p.label, amount: p.amount, due_on: p.due || null, paid_on: p.date || null, paid: !!p.paid, note: p.note || null }; });
    out.matches = [];
    S.tournament.rounds.forEach(function (r, ri) { r.forEach(function (m, mi) { out.matches.push({ tournament_id: 't1', round: ri, slot: mi, player_a: m.a || null, player_b: m.b || null, score_a: m.sa != null ? m.sa : null, score_b: m.sb != null ? m.sb : null, winner: m.w || null }); }); });
    out.ingredient_meals = []; S.ingredients.forEach(function (i) { i.meals.forEach(function (m) { out.ingredient_meals.push({ ingredient_id: i.id, meal_id: m }); }); });
    out.meal_attendance = []; Object.keys(S.attendance || {}).forEach(function (m) { Object.keys(S.attendance[m]).forEach(function (p) { out.meal_attendance.push({ meal_id: m, person_id: p, attends: !!S.attendance[m][p] }); }); });
    out.day_confirmations = []; Object.keys(S.dayConfirm || {}).forEach(function (p) { Object.keys(S.dayConfirm[p]).forEach(function (d) { out.day_confirmations.push({ person_id: p, day: d, status: S.dayConfirm[p][d] }); }); });
    out.activity_votes = []; Object.keys(S.votes || {}).forEach(function (a) { (S.votes[a] || []).forEach(function (p) { out.activity_votes.push({ activity_id: a, person_id: p }); }); });
    return out;
  }
  function snapshot(S) {
    var r = rows(S), snap = {};
    SYNC.forEach(function (t) {
      var name = t[0], pk = t[1], m = {};
      (r[name] || []).forEach(function (row) { m[pk.map(function (k) { return row[k]; }).join('|')] = { row: row, json: JSON.stringify(row) }; });
      snap[name] = m;
    });
    return snap;
  }

  /* ---------- Sincronización ---------- */
  api.queue = function () { dirty = true; clearTimeout(timer); timer = setTimeout(sync, 350); };
  function sync() {
    if (busy) { timer = setTimeout(sync, 300); return; }
    if (!last) return;
    busy = true; dirty = false;
    var cur = snapshot(S), ops = [];
    SYNC.forEach(function (t) {
      var name = t[0], pk = t[1], a = last[name] || {}, b = cur[name] || {};
      var ins = Object.keys(b).filter(function (k) { return !a[k]; }).map(function (k) { return b[k].row; });
      var upd = Object.keys(b).filter(function (k) { return a[k] && a[k].json !== b[k].json; }).map(function (k) { return b[k].row; });
      var del = Object.keys(a).filter(function (k) { return !b[k]; }).map(function (k) { return a[k].row; });
      if (ins.length) ops.push({ name: name, pk: pk, ins: ins });
      if (upd.length) ops.push({ name: name, pk: pk, upd: upd });
      if (del.length) ops.push({ name: name, pk: pk, del: del });
    });
    /* primero borrados de tablas puente, luego altas/cambios en orden de dependencias, y al final borrados de entidades */
    var joins = { ingredient_meals: 1, meal_attendance: 1, day_confirmations: 1, activity_votes: 1 };
    function w(o) { return o.del ? (joins[o.name] ? 0 : 3) : (joins[o.name] ? 2 : 1); }
    ops = ops.map(function (o, i) { o.i = i; return o; }).sort(function (x, y) { return (w(x) - w(y)) || (x.i - y.i); });
    function pkObj(o, row) { var m = {}; o.pk.forEach(function (k) { m[k] = row[k]; }); return m; }
    var chain = Promise.resolve();
    ops.forEach(function (o) {
      chain = chain.then(function () {
        if (o.ins) return client().from(o.name).insert(o.ins).then(check);
        var list = o.upd || o.del;
        return Promise.all(list.map(function (row) {
          var q = client().from(o.name);
          return (o.upd ? q.update(row) : q.delete()).match(pkObj(o, row)).then(check);
        }));
      });
    });
    chain.then(function () { last = cur; busy = false; if (dirty) api.queue(); })
      .catch(function (err) {
        busy = false;
        toast(/permission|policy|row-level|admin/i.test(err.message || '') ? 'No tienes permiso para ese cambio. Lo deshago' : 'No se ha podido guardar. Revisa la conexión');
        reload();
      });
  }
  function check(res) { if (res && res.error) throw res.error; return res; }

  /* ---------- Carga y tiempo real ---------- */
  function loadAll() {
    return Promise.all(TABLES.map(function (t) { return client().from(t).select('*').then(check).then(function (r) { return [t, r.data]; }); }))
      .then(function (list) { var d = {}; list.forEach(function (x) { d[x[0]] = x[1]; }); return d; });
  }
  function reload() {
    if (busy || dirty) { clearTimeout(reloadT); reloadT = setTimeout(reload, 500); return; }
    return loadAll().then(function (d) {
      S = fromDb(d); last = snapshot(S);
      if (!person(ui.me)) return api.logout();
      render(true);
    }).catch(function () {});
  }
  function subscribe() {
    client().channel('conclave').on('postgres_changes', { event: '*', schema: 'public' }, function () { clearTimeout(reloadT); reloadT = setTimeout(reload, 600); }).subscribe();
  }

  /* ---------- Acceso ---------- */
  function shell(inner) {
    $top.innerHTML = '<span class="wordmark"><b>Cónclave</b></span><span class="sp"></span>';
    $nav.innerHTML = '';
    $main.innerHTML = '<div class="view"><section class="hero glass" style="margin-top:28px"><canvas id="heroNet" aria-hidden="true"></canvas><div class="kicker">Plataforma familiar</div><h1>Cónclave</h1></section>' + inner + '</div>';
    startHero();
  }
  function loginView(msg) {
    shell('<section class="card"><h3>Entra con tu email</h3><p class="small muted">Te llega un enlace al correo. Ábrelo en este mismo móvil y listo.</p>' +
      '<div class="field"><label for="lg-email">Tu email</label><input id="lg-email" type="email" inputmode="email" autocomplete="email" placeholder="nombre@correo.com"></div>' +
      '<button class="btn primary block" data-act="cloudEmail">Enviarme el enlace</button>' +
      '<div class="field" id="lg-otp-box" hidden><label for="lg-otp">¿El email trae un código de 6 cifras? Escríbelo aquí</label><input id="lg-otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="btn block" data-act="cloudOtp">Entrar con ese código</button></div></section>' +
      '<section class="card"><h3>Tengo un código personal</h3><p class="small muted">El organizador te lo ha pasado por WhatsApp.</p>' +
      '<div class="field"><label for="lg-code">Código de 6 cifras</label><input id="lg-code" inputmode="numeric" maxlength="6" autocomplete="off" style="font-size:1.6rem;letter-spacing:.2em;font-weight:800"></div>' +
      '<button class="btn primary block" data-act="cloudCode">Entrar</button></section>' +
      (msg ? '<section class="card alert"><p>' + msg + '</p></section>' : ''));
  }
  function bootPending() {
    $main = document.getElementById('main'); $nav = document.getElementById('nav'); $top = document.getElementById('top');
    $top.innerHTML = '<span class="wordmark"><b>Cónclave</b></span>';
    $main.innerHTML = '<div class="view"><section class="hero glass" style="margin-top:28px"><div class="kicker">Casi listo</div><h1>Cónclave</h1><p class="place">Falta conectar la base de datos. En cuanto esté, aquí podréis entrar todos.</p></section></div>';
  }
  function afterSession() {
    return client().rpc('claim_person').then(check).then(function (r) {
      var pid = r.data;
      if (!pid) { shell('<section class="card alert"><h3>Esta cuenta no está en la lista</h3><p>Pide al organizador que añada tu email o que te pase un código.</p><button class="btn block" data-act="logout">Salir</button></section>'); return; }
      ui.me = pid;
      return loadAll().then(function (d) { S = fromDb(d); last = snapshot(S); startApp(); subscribe(); });
    }).catch(function (e) { loginView('No he podido entrar: ' + esc(e.message || 'error de conexión')); });
  }
  var started = false;
  function go2() { if (started) return; started = true; afterSession(); }
  api.boot = function () {
    loginView();
    client().auth.getSession().then(function (r) {
      if (r.data && r.data.session) go2();
    });
    client().auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_IN' && !S) go2(); });
  };
  api.logout = function () { client().auth.signOut().then(function () { location.href = api.siteUrl; }); };
  api.email = function () {
    var em = (val('lg-email') || '').trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { toast('Escribe tu email completo'); return; }
    client().rpc('email_allowed', { p_email: em }).then(check).then(function (r) {
      if (!r.data) { toast('Ese email no está en la lista. Pídeselo al organizador'); return; }
      return client().auth.signInWithOtp({ email: em, options: { emailRedirectTo: api.siteUrl, shouldCreateUser: true } }).then(check).then(function () {
        var b = document.getElementById('lg-otp-box'); if (b) b.hidden = false;
        toast('Enlace enviado a ' + esc(em) + '. Mira tu correo (y el spam)');
      });
    }).catch(function (e) { toast(/rate|seconds/i.test(e.message || '') ? 'Espera un minuto y vuelve a pedirlo' : 'No he podido enviar el enlace'); });
  };
  api.otp = function () {
    var em = (val('lg-email') || '').trim().toLowerCase(), tk = (val('lg-otp') || '').trim();
    client().auth.verifyOtp({ email: em, token: tk, type: 'email' }).then(check).then(go2).catch(function () { toast('Código incorrecto o caducado'); });
  };
  api.code = function () {
    var code = (val('lg-code') || '').replace(/\D/g, '');
    if (code.length !== 6) { toast('El código tiene 6 cifras'); return; }
    client().auth.signInAnonymously().then(check).then(function () { return client().rpc('claim_with_code', { p_code: code }).then(check); }).then(function (r) {
      if (!r.data) { return client().auth.signOut().then(function () { toast('Ese código no vale. Revísalo con el organizador'); }); }
      go2();
    }).catch(function () { toast('No he podido entrar con el código'); });
  };
  /* códigos personales: solo el admin puede leerlos o cambiarlos (RLS) */
  api.getCode = function (pid) { return client().from('access_codes').select('code').eq('person_id', pid).maybeSingle().then(function (r) { return r.data ? r.data.code : null; }); };
  api.setCode = function (pid, code) { return client().from('access_codes').upsert({ person_id: pid, code: code }, { onConflict: 'person_id' }).then(check); };
  return api;
})();
A.cloudEmail = function () { CLOUD.email(); };
A.cloudOtp = function () { CLOUD.otp(); };
A.cloudCode = function () { CLOUD.code(); };
A.logout = function () { CLOUD.logout(); };
if (CLOUD.getCode) { ACCESS.getCode = CLOUD.getCode; ACCESS.setCode = CLOUD.setCode; }
window.CLOUD = CLOUD;

})();
</script>
