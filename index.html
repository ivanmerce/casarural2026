<script>
/* =====================================================================
   Casa Rural · Lógica pura (sin DOM). Testeable con node: tests/logic.test.js
   ===================================================================== */
var L = (function () {
  var eur = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var num = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 2 });

  /* "1.234,56 €": Intl en es-ES no pone punto de miles con 4 cifras, lo forzamos */
  function money(v) {
    if (v == null || isNaN(v)) return '—';
    var s = eur.format(Math.round(v * 100) / 100);
    return s.replace(/^(-?)(\d)(\d{3}),/, '$1$2.$3,');
  }
  function n(v) { return num.format(v); }
  function ddmm(iso) { var d = iso.slice(0, 10).split('-'); return d[2] + '/' + d[1]; }
  function r2(v) { return Math.round(v * 100) / 100; }

  /* ---- Asistencia ---- */
  function attends(S, personId, mealId) {
    /* prioridad: excepción de esa comida > confirmación del día > valor por defecto de la persona */
    var o = S.attendance && S.attendance[mealId];
    if (o && personId in o) return !!o[personId];
    var m = S.meals.find(function (x) { return x.id === mealId; });
    var st = m ? dayStatus(S, personId, m.day) : 'pend';
    if (st === 'si') return true;
    if (st === 'no') return false;
    var p = S.people.find(function (x) { return x.id === personId; });
    return !!(p && p.attends);
  }
  /* ---- Confirmación por día: 'si' · 'no' · 'pend' ---- */
  function dayStatus(S, personId, day) {
    var c = S.dayConfirm && S.dayConfirm[personId];
    return (c && c[day]) || 'pend';
  }
  function dayCount(S, day) {
    var r = { si: 0, no: 0, pend: 0, pendYes: 0, total: S.people.length };
    S.people.forEach(function (p) {
      var st = dayStatus(S, p.id, day); r[st]++;
      if (st === 'pend' && p.attends) r.pendYes++;
    });
    r.expected = r.si + r.pendYes;           /* los que contamos para cantidades */
    return r;
  }
  /* Cantidad sugerida: los ingredientes con "per" están pensados para N comensales */
  function suggestQty(S, item) {
    if (!item.per || !item.meals || !item.meals.length) return null;
    var n = Math.max.apply(null, item.meals.map(function (id) { return diners(S, id).length; }));
    if (!n || n === item.per) return null;
    var q = item.qty * n / item.per;
    q = item.qty >= 10 || /u$|^u|latas|canelones|láminas/.test(item.unit) ? Math.ceil(q) : Math.ceil(q * 10) / 10;
    return q === item.qty ? null : { n: n, qty: q };
  }
  function diners(S, mealId) {
    return S.people.filter(function (p) { return attends(S, p.id, mealId); });
  }
  function mealsAttended(S, personId) {
    return S.meals.filter(function (m) { return attends(S, personId, m.id); }).length;
  }

  /* ---- Reparto ---- */
  function weightOf(S, p) {
    var w = (S.split && S.split.w) || { adulto: 1, menor: 0.5, bebe: 0 };
    return w[p.kind] != null ? w[p.kind] : 1;
  }
  /* familias fuera del reparto: por defecto, quien paga la casa (los abuelos). Lo que paguen o aporten se descuenta del bote */
  function excluded(S) {
    var x = S.split && S.split.exclude;
    if (Array.isArray(x)) return x.slice();
    return S.house && S.house.payer ? [S.house.payer] : [];
  }
  /* devuelve { familyId: fracción 0..1 } */
  function shares(S) {
    /* v0.5.9: el reparto es SIEMPRE proporcional por persona y comida (adultos y niños 1, bebé 0).
       Se ignora cualquier otro criterio guardado para que nadie lo cambie por error. */
    var mode = 'ponderado';
    var units = {};
    S.families.forEach(function (f) { units[f.id] = 0; });
    if (mode === 'familia') {
      S.families.forEach(function (f) {
        var any = S.people.some(function (p) { return p.family === f.id && mealsAttended(S, p.id) > 0; });
        units[f.id] = any ? 1 : 0;
      });
    } else {
      S.people.forEach(function (p) {
        var m = mealsAttended(S, p.id);
        var w = mode === 'persona' ? 1 : weightOf(S, p);
        units[p.family] = (units[p.family] || 0) + w * m;
      });
    }
    excluded(S).forEach(function (k) { if (k in units) units[k] = 0; });

    var out = {};
    Object.keys(units).forEach(function (k) { out[k] = tot ? units[k] / tot : 0; });
    return { share: out, units: units };
  }

  /* gastos comunes por familia. Un producto que una familia se pide cuenta ya a su cargo:
     con el precio real si lo ha apuntado y, si no, con el estimado. «Viene de casa» = 0 €. */
  function itemCost(i) { if (i.status === 'casa') return 0; return i.cost != null ? i.cost : (i.est || 0); }   /* para previsiones */
  function realCost(i) { if (i.status === 'casa') return 0; return i.cost != null ? i.cost : null; }           /* para Cuentas */
  function needsPrice(i) { return !!i.family && realCost(i) == null; }
  function paidBy(S) {
    var paid = {};
    S.families.forEach(function (f) { paid[f.id] = 0; });
    S.ingredients.forEach(function (i) {
      if ((i.split || 'comun') !== 'comun' || !i.family || paid[i.family] == null) return;
      var v = realCost(i); if (v != null) paid[i.family] += v;   /* sin precio real todavía no cuenta */
    });
    (S.expenses || []).forEach(function (e) {
      if ((e.split || 'comun') !== 'comun' || e.kind === 'aportacion') return;
      if (e.payer && e.amount) paid[e.payer] += e.amount;

  /* mínimo número de transferencias (voraz: mayor deudor paga a mayor acreedor) */
  function settle(balances) {
    var debt = [], cred = [];
    Object.keys(balances).forEach(function (k) {
      var v = r2(balances[k]);
      if (v < -0.005) debt.push({ id: k, v: -v });
      else if (v > 0.005) cred.push({ id: k, v: v });

    while (debt.length && cred.length) {
      debt.sort(function (a, b) { return b.v - a.v; });
      cred.sort(function (a, b) { return b.v - a.v; });

      var amt = r2(Math.min(d.v, c.v));

    var g = {}; S.families.forEach(function (f) { g[f.id] = 0; });

    var sh = shares(S);
    var rows = S.families.map(function (f) {
      var gift = r2(g[f.id] * ratio);
      var owe = r2(toShare * sh.share[f.id] + gift);
      return { id: f.id, paid: paid[f.id], owe: owe, gift: gift, bal: r2(paid[f.id] - owe), share: sh.share[f.id], units: sh.units[f.id] };
    });
    var sumOwe = r2(rows.reduce(function (a, r) { return a + r.owe; }, 0));
    var diff = r2(total - sumOwe);
    if (diff !== 0 && rows.length) {
      var big = rows.slice().sort(function (a, b) { return b.owe - a.owe; })[0];
      big.owe = r2(big.owe + diff); big.bal = r2(big.paid - big.owe);
    }

  }

  /* ¿Cae una comida fuera del horario de entrada/salida que habéis elegido? */
  function mealConflict(S, m, time) {
    var first = S.days[0].k, last = S.days[S.days.length - 1].k;
    if (m.day === first && S.trip.arrival && time < S.trip.arrival) return 'Es antes de vuestra hora de llegada (' + S.trip.arrival + ')';

  }
  function offHours(S) {
    var o = S.trip.official || {}, w = [];
    if (o.arrival && S.trip.arrival && S.trip.arrival < o.arrival) w.push('Llegada a las ' + S.trip.arrival + ': la finca abre a las ' + o.arrival + '. Hay que pedirlo');
    if (o.departure && S.trip.departure && S.trip.departure > o.departure) w.push('Salida a las ' + S.trip.departure + ': la finca pide salir a las ' + o.departure + '. Hay que pedirlo');
    return w;
  }

  /* ---- Compra ---- */
  /* previsión del gasto común total, lo compre quien lo compre (lo que aún no tiene dueño también cuenta) */
  function estCommon(S) {
    var t = 0;
    S.ingredients.forEach(function (i) { if ((i.split || 'comun') !== 'comun' || i.status === 'casa') return; var v = i.cost != null ? i.cost : i.est; if (v) t += v; });
    (S.expenses || []).forEach(function (e) { if ((e.split || 'comun') === 'comun' && e.kind !== 'aportacion' && e.amount) t += e.amount; });
    return r2(t);
  }
  function unassigned(S) { return S.ingredients.filter(function (i) { return !i.family; }); }
  function coverage(items) {
    var tot = items.length, done = items.filter(function (i) { return !!i.family; }).length;
    return { tot: tot, done: done, pct: tot ? Math.round(done / tot * 100) : 0 };
  }

  /* ---- Tasa turística ---- */
  /* Tasa turística (Llei 5/2017 mod. Llei 2/2026): por persona y noche; exentas las personas de 16 años o menos.
     Noches reales de cada uno según la confirmación por día (o su asistencia por defecto si aún no ha confirmado). */
  function sleeps(S, p, day) {
    var st = dayStatus(S, p.id, day);
    return st === 'si' || (st === 'pend' && !!p.attends);
  }
  function taxPays(S, p) {
    var t = S.tax || {}, maxEx = t.maxExemptAge != null ? t.maxExemptAge : (t.minAge != null ? t.minAge - 1 : 16);
    if (p.age != null) return p.age > maxEx;

  }
  function tax(S) {
    var t = S.tax || { perNight: 1.1, nights: 3 };
    var nightDays = (S.days || []).slice(0, t.nights || Math.max(0, (S.days || []).length - 1)).map(function (d) { return d.k; });
    var rows = S.people.map(function (p) {
      var n = nightDays.filter(function (d) { return sleeps(S, p, d); }).length;
      var pays = taxPays(S, p);
      return { id: p.id, nights: n, pays: pays, amount: pays ? r2(n * t.perNight) : 0 };
    }).filter(function (r) { return r.nights > 0; });
    var payers = rows.filter(function (r) { return r.pays; });
    var stays = payers.reduce(function (a, r) { return a + r.nights; }, 0);
    var allStays = rows.reduce(function (a, r) { return a + r.nights; }, 0);
    return {
      rows: rows, adults: payers.length, exempt: rows.length - payers.length, all: rows.length, stays: stays,

    };
  }

  var WMO = {
    0: ['Despejado', 'sun'], 1: ['Casi despejado', 'sun'], 2: ['Intervalos de nubes', 'partly'], 3: ['Nublado', 'cloud'],
    45: ['Niebla', 'fog'], 48: ['Niebla', 'fog'], 51: ['Llovizna', 'rain'], 53: ['Llovizna', 'rain'], 55: ['Llovizna', 'rain'],
    61: ['Lluvia débil', 'rain'], 63: ['Lluvia', 'rain'], 65: ['Lluvia fuerte', 'rain'], 80: ['Chubascos', 'rain'], 81: ['Chubascos', 'rain'],
    82: ['Chubascos fuertes', 'rain'], 95: ['Tormenta', 'storm'], 96: ['Tormenta', 'storm'], 99: ['Tormenta', 'storm']
  };
  function wmo(code) { return WMO[code] || ['Variable', 'partly']; }
  function advice(d) {
    var wet = d.prob >= 50 || d.rain >= 2;
    return {
      pool: d.tmax >= 27 && !wet ? { ok: true, t: 'Piscina: quizá, si el agua no está helada' } : { ok: false, t: 'Piscina: no. ' + (d.tmax < 27 ? 'Máxima de ' + Math.round(d.tmax) + ' °C, el agua estará fría' : 'Riesgo de lluvia') },
      bbq: !wet && d.wind < 35 ? { ok: true, t: 'Barbacoa al aire libre: adelante' } : { ok: false, t: 'Barbacoa: mejor dentro de La Barbacoa' },
      clothes: d.tmin < 10 ? 'Capas: noche fresca (' + Math.round(d.tmin) + ' °C). Chaqueta y sudadera' : (d.tmin < 14 ? 'Sudadera para la noche' : 'Manga corta de día, algo fino de noche'),
      planB: wet ? { on: true, t: 'Activar plan B bajo techo' } : { on: false, t: 'Plan B preparado, de momento no hace falta' }
    };
  }

  /* ---- Torneo ---- */
  function advance(T) {
    for (var r = 0; r < T.rounds.length - 1; r++) {
      T.rounds[r].forEach(function (m, i) {
        var next = T.rounds[r + 1][Math.floor(i / 2)];
        var side = i % 2 === 0 ? 'a' : 'b';

        if (next[side] !== w) { next[side] = w; next.w = null; next.sa = next.sb = null; }
      });
    }
    var f = T.rounds[T.rounds.length - 1][0];
    return f.w ? f[f.w] : null;
  }

  return { gifts: gifts, mealConflict: mealConflict, offHours: offHours, dayStatus: dayStatus, dayCount: dayCount, suggestQty: suggestQty, money: money, n: n, ddmm: ddmm, r2: r2, attends: attends, diners: diners, mealsAttended: mealsAttended, shares: shares, paidBy: paidBy, settle: settle, ledger: ledger, coverage: coverage, excluded: excluded, itemCost: itemCost, realCost: realCost, needsPrice: needsPrice, estCommon: estCommon, unassigned: unassigned, tax: tax, taxPays: taxPays, sleeps: sleeps, wmo: wmo, advice: advice, advance: advance };
})();
if (typeof module !== 'undefined') module.exports = L;

/* ===================== Juegos, competición y premios: lógica pura =====================
   Sin datos personales: nombres, dúos, edades y juegos llegan de S (semilla privada o Supabase).
   Participante ("entrant") = una persona o un dúo (p. ej. un adulto con un bebé que compiten juntos). */
var G = (function () {
  var DEFAULT_POINTS = [10, 8, 6, 5, 4, 3, 2, 1];
  var CATS = { deporte: 'Deporte', velocidad: 'Velocidad', ingenio: 'Ingenio', escondite: 'Escondite', mini: 'Minijuego', mesa: 'Mesa' };
  var FORMATS = { bracket: 'Eliminatoria', league: 'Liguilla', teams: 'Por equipos', ranking: 'Clasificación' };
  var MODES = { order: 'Orden de llegada', high: 'Más es mejor', low: 'Menos es mejor' };

  function r2(x) { return Math.round(x * 100) / 100; }
  function comp(S) { return S.comp || { duos: [] }; }
  function duos(S) { return comp(S).duos || []; }
  function person(S, id) { return S.people.find(function (p) { return p.id === id; }); }
  function duoOf(S, pid) { return duos(S).find(function (d) { return d.members.indexOf(pid) >= 0; }); }

  /* ---------- Participantes ---------- */
  function entrantIds(S) {
    var out = [], seen = {};
    S.people.forEach(function (p) { var d = duoOf(S, p.id), id = d ? d.id : p.id; if (!seen[id]) { seen[id] = 1; out.push(id); } });
    return out;
  }
  function entrant(S, id) {
    var d = duos(S).find(function (x) { return x.id === id; });
    if (d) return { id: d.id, name: d.name, members: d.members.slice(), duo: true };
    var p = person(S, id);
    return p ? { id: p.id, name: p.name, members: [p.id], duo: false } : null;
  }
  function entrantOf(S, pid) { var d = duoOf(S, pid); return d ? d.id : pid; }
  function membersOf(S, id) { var e = entrant(S, id); return e ? e.members : []; }
  /* ¿Está ese día? (confirmado o, si no ha confirmado, su asistencia por defecto) */
  function presentOn(S, id, day) {
    return membersOf(S, id).some(function (pid) {
      var p = person(S, pid); if (!p) return false;
      var c = S.dayConfirm && S.dayConfirm[pid];
      if (day) { var st = c && c[day]; return st === 'si' || (!st && !!p.attends); }
      return !!p.attends || !!(c && Object.keys(c).some(function (k) { return c[k] === 'si'; }));
    });
  }
  function presentList(S, day) { return entrantIds(S).filter(function (id) { return presentOn(S, id, day); }); }
  /* edad "de competición": la del mayor del dúo */
  function ageOf(S, id) { var a = membersOf(S, id).map(function (pid) { var p = person(S, pid); return p && p.age != null ? p.age : (p && p.kind === 'adulto' ? 40 : 10); }); return a.length ? Math.max.apply(null, a) : 0; }

  /* ---------- Eliminatoria ---------- */
  function nextPow2(n) { var p = 1; while (p < n) p *= 2; return p; }
  function seedOrder(n) { var r = [0]; while (r.length < n) { var m = r.length * 2, nr = []; r.forEach(function (x) { nr.push(x, m - 1 - x); }); r = nr; } return r; }
  /* list ya ordenada por cabeza de serie; los primeros reciben los "pases" si faltan rivales */
  function makeBracket(list) {
    var n = Math.max(2, list.length), size = nextPow2(n), order = seedOrder(size), rounds = [], first = [];
    for (var i = 0; i < size; i += 2) first.push({ a: list[order[i]] || null, b: list[order[i + 1]] || null, sa: null, sb: null, w: null });
    rounds.push(first);
    for (var k = size / 4; k >= 1; k /= 2) rounds.push(Array.from({ length: k }, function () { return { a: null, b: null, sa: null, sb: null, w: null }; }));
    return rounds;
  }
  function roundName(total, r) {
    var left = total - r;

  }
  function winnerOf(m, r) {
    if (m.w === 'a' || m.w === 'b') return m[m.w];

    if (r === 0 && m.b && !m.a) return m.b;
    return null;
  }
  /* propaga ganadores; si cambia quién juega un partido, se borra su resultado. Devuelve el campeón */
  function advance(g) {
    var R = g.rounds || [];
    for (var r = 0; r < R.length - 1; r++) {
      R[r].forEach(function (m, i) {
        var nx = R[r + 1][Math.floor(i / 2)], side = i % 2 ? 'b' : 'a', w = winnerOf(m, r);
        if (nx[side] !== w) { nx[side] = w; nx.w = null; nx.sa = nx.sb = null; }
      });

  }
  function isBye(m, r) { return r === 0 && (!m.a || !m.b); }

  /* ---------- Liguilla (todos contra todos) ---------- */
  function roundRobin(ids) {
    var out = [];
    for (var i = 0; i < ids.length; i++) for (var j = i + 1; j < ids.length; j++) out.push({ a: ids[i], b: ids[j], sa: null, sb: null, w: null });
    return out;
  }
  function table(ids, matches) {
    var t = {}; ids.forEach(function (id) { t[id] = { id: id, pj: 0, g: 0, e: 0, p: 0, pts: 0, gf: 0, gc: 0 }; });
    (matches || []).forEach(function (m) {

function presenceData() {
  if (window.CLOUD && CLOUD.presence) return CLOUD.presence;

function timeAgo(iso) {
  if (!iso) return null;

  S.dayConfirm = S.dayConfirm || {}; S.attendance = S.attendance || {}; S.expenses = S.expenses || [];
  if (!ui.me || !person(ui.me)) { var ad = S.people.find(function (p) { return p.role === 'admin'; }) || S.people[0]; ui.me = ad.id; }
  document.title = S.trip.name; CATS.marc = 'Menú ' + babyName();
  buildEggs(); applyPrefs(); render(); navInit();
  refreshWeather(false);
  var h = new Date().getHours(); if (h < 5) setTimeout(function () { if (!hasEgg('buho')) eggToast('buho', '¿Despierto a estas horas? Mañana hay hockey. A dormir, búho.'); }, 1500);
  var today = new Date().toISOString().slice(0, 10);
  var bd = S.trip.eggs && S.trip.eggs.bdayDate;
  if (bd && today === bd && ui.bdaySeen !== today) { ui.bdaySeen = today; saveUi(); setTimeout(bdayParty, 900); }
  if (countdownParts().phase === 'during') egg('zero');
  secretsWatch();
  setInterval(function () { var d = new Date(); if (d.getHours() % 12 === 11 && d.getMinutes() === 11 && ui.lastWish !== d.toDateString() + d.getHours()) { ui.lastWish = d.toDateString() + d.getHours(); wish1111(); } }, 20000);
}
function boot() {
  var u = loadUi();
  ui = { tab: u.tab || 'inicio', me: u.me || null, fam: null, st: 'pendiente', howClosed: !!u.howClosed, superMode: !!u.superMode, day: null, sub: 'plan', costView: 'real', bdaySeen: u.bdaySeen, prefs: loadPrefs() };
  if (['personas', 'tiempo', 'asistencia', 'manual', 'casas'].indexOf(ui.tab) >= 0) ui.tab = 'inicio';
  $main = document.getElementById('main'); $nav = document.getElementById('nav'); $top = document.getElementById('top');
  applyPrefs(); bindEvents();
  if (typeof SEED !== 'undefined') { S = load(); startApp(); }
  else if (window.CLOUD) CLOUD.boot();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

/* ===================== Juegos, competición y premios: vistas y acciones =====================
   Pensado para el móvil en plena partida: botones grandes, marcador con + y −, un toque para dar la victoria. */

function gById(id) { return (S.games || []).find(function (g) { return g.id === id; }); }
function isFam(id) { return String(id).indexOf('fam:') === 0; }
function eAv(id, cls) {
  if (isFam(id)) { var f = id.slice(4); return '<span class="av-stack">' + S.people.filter(function (p) { return p.family === f; }).slice(0, 4).map(function (p) { return av(p.id, cls || 'sm'); }).join('') + '</span>'; }
  var e = G.entrant(S, id); if (!e) return '';
  if (!e.duo) return av(id, cls);
  return '<span class="av-duo">' + e.members.map(function (m) { return av(m, cls); }).join('') + '</span>';
}
function eName(id) {
  if (isFam(id)) { var f = fam(id.slice(4)); return f ? esc(f.name) : ''; }
  var e = G.entrant(S, id); if (!e) return esc(id);
  return e.duo ? esc(e.name) : pname(id);
}
function eText(id) { if (isFam(id)) { var f = fam(id.slice(4)); return f ? f.name : ''; } var e = G.entrant(S, id); return e ? e.name : id; }
function gIcon(g) { return icon(g.icon || { deporte: 'ball', velocidad: 'bolt', ingenio: 'bulb', escondite: 'ghost', mini: 'star', mesa: 'games' }[g.cat] || 'trophy'); }
function gHasAny(g) {
  if (g.format === 'bracket') return (g.rounds || []).some(function (r, ri) { return r.some(function (m) { return (m.w && !G.isBye(m, ri)) || m.sa != null || m.sb != null; }); });
  if (g.format === 'ranking' || g.teamRank) return (g.order || []).length > 0 || Object.keys(g.results || {}).length > 0;
  return (g.matches || []).some(function (m) { return m.w || m.sa != null || m.sb != null; });
}
function gStatus(g) { return G.isDone(S, g) ? 'fin' : gHasAny(g) ? 'vivo' : 'prox'; }
var GST = { prox: ['Próximo', ''], vivo: ['En juego', 'red live'], fin: ['Terminado', 'ok'] };
function gWhen(g) { var d = g.day && dayOf(g.day); return (d ? d.short : 'Cuando queráis') + (g.time ? ' · ' + g.time : ''); }
function ensureGame(g) {
  if (g.format === 'bracket' && !g.rounds) { g.rounds = G.makeBracket(g.entrants || []); G.advance(g); }
  if (g.format === 'teams') { g.teams = g.teams || []; g.matches = g.matches || []; }
  if (g.format === 'league' && !g.matches) g.matches = G.roundRobin(g.entrants || []);
  if (g.format === 'ranking') { g.order = g.order || []; g.results = g.results || {}; }
  return g;
}
function gPointsText(g) {
  var t = g.points && g.points.length ? g.points : G.DEFAULT_POINTS;
  return t.map(function (p, i) { return (i + 1) + '.º ' + p; }).join(' · ') + ' · resto ' + (g.part != null ? g.part : 1);
}
function medal(pos) { return pos === 1 ? '<span class="medal g">1</span>' : pos === 2 ? '<span class="medal s">2</span>' : pos === 3 ? '<span class="medal b">3</span>' : '<span class="medal">' + (pos || '–') + '</span>'; }

/* ---------- Tarjeta de Inicio ---------- */
function compCard() {
  var rank = G.ranking(S), leader = rank.filter(function (r) { return r.pos === 1 && r.pts > 0; });
  var live = (S.games || []).filter(function (g) { return gStatus(g) === 'vivo'; });
  var now = new Date().toISOString().slice(0, 16).replace('T', ' ');
  var next = (S.games || []).filter(function (g) { return gStatus(g) === 'prox' && g.day; }).sort(function (a, b) { return (a.day + a.time).localeCompare(b.day + b.time); })
    .filter(function (g) { return (g.day + ' ' + (g.time || '00:00')) >= now; })[0] || (S.games || []).filter(function (g) { return gStatus(g) === 'prox'; })[0];
  var done = G.doneGames(S).length, tot = (S.games || []).length;
  return '<section class="card comp-card"><div class="card-head"><h3 class="row" style="gap:8px">' + icon('trophy') + 'Competición</h3><button class="link" data-act="tab" data-tab="juegos">Juegos ' + icon('arrow') + '</button></div>' +
    (leader.length ? '<button class="leader" data-act="jsub" data-v="ranking">' + eAv(leader[0].id, 'sm') + '<span class="grow"><span class="eyebrow">Líder del finde</span><b>' + leader.map(function (l) { return eName(l.id); }).join(' y ') + '</b></span><span class="big num">' + leader[0].pts + '</span><small class="muted">pts</small></button>'
      : '<p class="small muted">Nadie ha puntuado todavía. El trono está libre.</p>') +
    (live.length ? live.map(function (g) { return '<button class="game-mini" data-act="gOpen" data-id="' + g.id + '">' + gIcon(g) + '<span class="grow"><b>' + esc(g.name) + '</b><small class="muted">' + gWhen(g) + '</small></span><span class="pill red live">En juego</span></button>'; }).join('')
      : next ? '<button class="game-mini" data-act="gOpen" data-id="' + next.id + '">' + gIcon(next) + '<span class="grow"><b>' + esc(next.name) + '</b><small class="muted">Próximo · ' + gWhen(next) + '</small></span>' + icon('arrow') + '</button>' : '') +
    '<div class="progress" aria-label="Juegos terminados"><i style="width:' + (tot ? Math.round(done / tot * 100) : 0) + '%"></i></div><p class="small muted">' + done + ' de ' + tot + ' juegos terminados · ' + G.awards(S).filter(function (a) { return a.winners.length; }).length + ' premios en juego</p></section>';
}

/* ---------- Vista principal ---------- */
VIEWS.juegos = function () {
  if (ui.game) { var g = gById(ui.game); if (g) return gameView(ensureGame(g)); ui.game = null; }
  var sub = ui.jsub || 'juegos';
  var h = '<div class="view-head"><div><h2>Juegos</h2><p class="muted small">Competición, ranking y premios del finde</p></div></div>' +
    '<div class="seg" role="group" aria-label="Sección"><button data-act="jsub" data-v="juegos" aria-pressed="' + (sub === 'juegos') + '">Juegos</button><button data-act="jsub" data-v="ranking" aria-pressed="' + (sub === 'ranking') + '">Ranking</button><button data-act="jsub" data-v="premios" aria-pressed="' + (sub === 'premios') + '">Premios</button></div>';
  if (sub === 'ranking') return h + rankingView();
  if (sub === 'premios') return h + premiosView();
  return h + gamesList();
};

function gamesList() {
  var gs = (S.games || []).slice().sort(function (a, b) { return ((a.day || '9') + (a.time || '')).localeCompare((b.day || '9') + (b.time || '')) || (a.sort || 0) - (b.sort || 0); });
  if (!gs.length) return '<div class="empty">' + icon('games') + '<b>Sin juegos todavía</b><span>Pulsa + y crea el primero. El sofá no cuenta como deporte.</span></div>' + (can('edit') ? '<button class="fab" data-act="gNew" aria-label="Añadir juego">' + icon('plus') + '</button>' : '');
  var h = '', groups = {};
  gs.forEach(function (g) { var k = g.day || 'x'; (groups[k] = groups[k] || []).push(g); });
  var live = gs.filter(function (g) { return gStatus(g) === 'vivo'; });
  if (live.length) h += '<p class="eyebrow live-label"><span class="live-dot" aria-hidden="true"></span> En juego ahora</p>' + live.map(gameCard).join('');
  S.days.concat([{ k: 'x', long: 'Cuando queráis' }]).forEach(function (d) {
    var list = (groups[d.k] || []).filter(function (g) { return gStatus(g) !== 'vivo'; }); if (!list.length) return;
    h += '<p class="eyebrow">' + esc(d.long) + '</p>' + list.map(gameCard).join('');
  });
  h += '<section class="card wood small"><h3>Cómo se puntúa</h3><p>Cada juego reparte puntos según el puesto (se puede cambiar en cada juego). El ranking global suma todo. Si hay empate a puntos, manda quien tenga más oros, luego platas y luego bronces.</p><p class="muted">Todos compiten por su cuenta. ' + esc((S.comp && S.comp.duos || []).map(function (d) { return d.name; }).join(', ')) + (S.comp && S.comp.duos && S.comp.duos.length ? ' compiten en pareja: si ganan, ganan los dos.' : '') + '</p></section>';
  if (can('edit')) h += '<button class="fab" data-act="gNew" aria-label="Añadir juego">' + icon('plus') + '</button>';
  return h;
}
function gameCard(g) {
  ensureGame(g);
  var st = gStatus(g), sd = G.standings(S, g), ents = g.entrants || [];
  var champ = sd.complete || g.closed ? sd.rows.filter(function (r) { return r.pos === 1; }).map(function (r) { return r.id; }) : [];
  var prog = g.format === 'ranking' ? ' · ' + sd.rows.filter(function (r) { return r.pos; }).length + '/' + ents.length + ' con resultado' : '';
  return '<button class="card game-card st-' + st + '" data-act="gOpen" data-id="' + g.id + '">' +
    '<span class="g-ico">' + gIcon(g) + '</span><span class="grow g-body"><span class="row" style="gap:6px;flex-wrap:wrap"><b class="g-name">' + esc(g.name) + '</b></span>' +
    '<span class="small muted">' + gWhen(g) + (g.where ? ' · ' + esc(g.where) : '') + '</span>' +
    '<span class="row wrap" style="gap:6px"><span class="pill ' + GST[st][1] + '">' + GST[st][0] + '</span><span class="pill">' + G.FORMATS[g.format] + '</span>' + (g.needs && /PENDIENTE/.test(g.needs) ? '<span class="pill pend">Material pendiente</span>' : '') + '</span>' +
    (champ.length ? '<span class="g-champ">' + icon('trophy') + eAv(champ[0], 'xs') + '<b>' + champ.map(eName).join(', ') + '</b></span>' :
      '<span class="avs">' + ents.slice(0, 7).map(function (id) { return eAv(id, 'xs'); }).join('') + (ents.length > 7 ? '<span class="more">+' + (ents.length - 7) + '</span>' : '') + '<small class="muted">' + ents.length + ' jugadores' + prog + '</small></span>') +
    '</span>' + icon('arrow') + '</button>';
}

/* ---------- Ficha de un juego ---------- */
function gameView(g) {
  var ed = can('edit'), st = gStatus(g), sd = G.standings(S, g);
  var act = g.act && S.activities.find(function (a) { return a.id === g.act; });
  var h = '<div class="g-top"><button class="icon-btn" data-act="gBack" aria-label="Volver a juegos">' + icon('back') + '</button><div class="grow"><span class="eyebrow">' + esc(G.CATS[g.cat] || '') + ' · ' + G.FORMATS[g.format] + '</span><h2>' + esc(g.name) + '</h2></div>' +
    (ed ? '<button class="icon-btn" data-act="gEdit" data-id="' + g.id + '" aria-label="Editar juego">' + icon('edit') + '</button>' : '') + '</div>';
  h += '<div class="facts"><span class="pill ' + GST[st][1] + '">' + GST[st][0] + '</span><span class="fact">' + icon('clock') + gWhen(g) + '</span>' + (g.where ? '<span class="fact">' + icon('pin') + esc(g.where) + '</span>' : '') + '<span class="fact">' + icon('users') + (g.entrants || []).length + '</span></div>';
  if (g.needs) h += '<p class="small needs">' + icon('umbrella') + '<span><b>Material:</b> ' + esc(g.needs) + '</span></p>';
  if (g.rules) h += '<details class="rules"><summary>Reglas</summary><p class="small">' + esc(g.rules) + '</p></details>';
  if (act) h += '<button class="link small" data-act="tab" data-tab="planes">En el planning: ' + esc(dayOf(act.day).short) + ' ' + act.start + ' · ' + esc(act.title) + ' ' + icon('arrow') + '</button>';
  if (!ed) h += '<p class="small pill pend" style="white-space:normal">Modo lector: ves los resultados en directo. Los apuntan los editores.</p>';

  if (sd.champion && (g.format === 'bracket' || g.format === 'league')) h += '<div class="champ card">' + icon('trophy') + '<div class="grow"><span class="eyebrow">Campeón</span><h3>' + eName(sd.champion) + '</h3></div><button class="btn" data-act="gTrophy" data-id="' + g.id + '">Trofeo</button></div>';

  if (g.format === 'bracket') h += bracketHtml(g, ed);
  else if (g.format === 'league') h += leagueHtml(g, ed);
  else if (g.format === 'teams') h += teamsHtml(g, ed);
  else h += rankingInputHtml(g, ed);

  h += standingsHtml(g, sd);
  if (ed) h += '<div class="row wrap">' + (g.format === 'bracket' ? '<button class="btn" data-act="gReseed" data-id="' + g.id + '">' + icon('shuffle') + 'Sortear cuadro</button>' : '') +
    '<button class="btn ' + (g.closed ? '' : 'ghost') + '" data-act="gClose" data-id="' + g.id + '">' + (g.closed ? icon('undo') + 'Reabrir juego' : icon('check') + 'Dar por terminado') + '</button></div>';
  return h;
}
function stepper(g, k, side, v, dis) {
  return '<span class="stepper"><button data-act="gScore" data-g="' + g.id + '" data-k="' + k + '" data-s="' + side + '" data-d="-1" aria-label="Restar"' + dis + '>' + icon('minus') + '</button><b class="num' + (v != null ? '' : ' muted') + '">' + (v != null ? v : 0) + '</b><button data-act="gScore" data-g="' + g.id + '" data-k="' + k + '" data-s="' + side + '" data-d="1" aria-label="Sumar"' + dis + '>' + icon('plus') + '</button></span>';
}
/* un partido: dos filas grandes; tocar el nombre da la victoria */
function matchHtml(g, k, m, ed, label, bye, names) {
  names = names || {};
  var rows = ['a', 'b'].map(function (s) {
    var id = m[s], win = m.w === s, dis = ed && id && !bye ? '' : ' disabled';
    var nm = id ? (names[s] || eName(id)) : '<span class="muted">' + (bye ? 'Pasa directo' : 'Por decidir') + '</span>';
    return '<div class="mt-row' + (win ? ' win' : '') + (m.w && !win && m.w !== 'draw' ? ' lose' : '') + '"><button class="mt-name" data-act="gWin" data-g="' + g.id + '" data-k="' + k + '" data-s="' + s + '"' + dis + '>' + (id && !names[s] ? eAv(id, 'sm') : '') + '<span class="grow">' + nm + '</span>' + (win ? icon('check') : '') + '</button>' + (id && !bye ? stepper(g, k, s, m['s' + s], ed ? '' : ' disabled') : '') + '</div>';
  }).join('');
  var foot = '';
  if (ed && !bye && m.a && m.b && !m.w) {
    if (m.sa != null && m.sb != null) foot += '<button class="chip" data-act="gFinish" data-g="' + g.id + '" data-k="' + k + '">' + icon('check') + 'Terminar ' + m.sa + '–' + m.sb + '</button>';
    if (g.allowDraw) foot += '<button class="chip" data-act="gWin" data-g="' + g.id + '" data-k="' + k + '" data-s="draw">Empate</button>';
  }
  if (m.w === 'draw') foot += '<span class="pill">Empate</span>' + (ed ? '<button class="chip" data-act="gWin" data-g="' + g.id + '" data-k="' + k + '" data-s="draw">Quitar empate</button>' : '');
  return '<div class="match-card' + (m.w ? ' done' : '') + (bye ? ' bye' : '') + '">' + (label ? '<span class="eyebrow">' + label + '</span>' : '') + rows + (foot ? '<div class="row wrap mt-foot">' + foot + '</div>' : '') + '</div>';
}
function bracketHtml(g, ed) {
  var R = g.rounds || [];
  return R.map(function (round, ri) {
    var ms = round.map(function (m, mi) { return { m: m, mi: mi, bye: G.isBye(m, ri) }; });
    var real = ms.filter(function (x) { return !x.bye; }), byes = ms.filter(function (x) { return x.bye && (x.m.a || x.m.b); });
    return '<section class="round-sec"><h3 class="row" style="gap:8px">' + G.roundName(R.length, ri) + '<span class="small muted">' + real.filter(function (x) { return x.m.w; }).length + '/' + real.length + '</span></h3>' +
      real.map(function (x) { return matchHtml(g, 'b:' + ri + ':' + x.mi, x.m, ed); }).join('') +
      (byes.length ? '<p class="small muted byes">Pasan directos: ' + byes.map(function (x) { return eName(x.m.a || x.m.b); }).join(', ') + '</p>' : '') + '</section>';
  }).join('');
}
function leagueHtml(g, ed) {
  var ms = g.matches || [], pend = [], done = [];
  ms.forEach(function (m, i) { (m.w ? done : pend).push(matchHtml(g, 'l:' + i, m, ed)); });
  var tb = G.table(g.entrants || [], ms);
  return '<section class="card"><h3>Tabla</h3><div class="tbl-wrap"><table class="tbl lg"><thead><tr><th></th><th>Jugador</th><th>PJ</th><th>G</th><th>P</th><th>Pts</th></tr></thead><tbody>' +
    tb.map(function (t) { return '<tr><td>' + medal(t.pj ? t.pos : null) + '</td><td><span class="row" style="gap:6px">' + eAv(t.id, 'xs') + eName(t.id) + '</span></td><td>' + t.pj + '</td><td>' + t.g + '</td><td>' + t.p + '</td><td><b>' + t.pts + '</b></td></tr>'; }).join('') + '</tbody></table></div></section>' +
    (pend.length ? '<p class="eyebrow">Por jugar · ' + pend.length + '</p>' + pend.join('') : '') + (done.length ? '<p class="eyebrow">Jugados · ' + done.length + '</p>' + done.join('') : '');
}
function teamsHtml(g, ed) {
  var teams = g.teams || [], inTeam = {};
  teams.forEach(function (t) { t.members.forEach(function (id) { inTeam[id] = t.id; }); });
  var loose = (g.entrants || []).filter(function (id) { return !inTeam[id]; });
  var h = '<section class="card"><div class="card-head"><h3>Equipos</h3>' + (ed ? '<button class="btn" data-act="gShuffleTeams" data-id="' + g.id + '">' + icon('shuffle') + 'Sortear</button>' : '') + '</div>';
  if (!teams.length) h += '<p class="small muted">Aún no hay equipos. ' + (ed ? 'Pulsa «Sortear» y salen equilibrados por edades (se pueden retocar).' : 'Los hará un editor.') + '</p>';
  else h += (ed ? '<p class="small muted">Toca a alguien para pasarle al siguiente equipo.</p>' : '') + '<div class="teams">' + teams.map(function (t, i) {
    return '<div class="team tc' + (i % 4 + 1) + '">' + (ed ? '<input class="team-name" aria-label="Nombre del equipo" data-change="gTeamName" data-g="' + g.id + '" data-t="' + t.id + '" value="' + esc(t.name) + '">' : '<b>' + esc(t.name) + '</b>') +
      '<div class="team-m">' + (t.members.length ? t.members.map(function (id) { return '<button class="chip p-chip" data-act="gTeam" data-g="' + g.id + '" data-e="' + id + '"' + (ed ? '' : ' disabled') + '>' + eAv(id, 'xs') + eName(id) + '</button>'; }).join('') : '<span class="small muted">Vacío</span>') + '</div></div>';
  }).join('') + '</div>';
  if (loose.length && teams.length) h += '<div class="team loose"><span class="eyebrow">Sin equipo</span><div class="team-m">' + loose.map(function (id) { return '<button class="chip p-chip" data-act="gTeam" data-g="' + g.id + '" data-e="' + id + '"' + (ed ? '' : ' disabled') + '>' + eAv(id, 'xs') + eName(id) + '</button>'; }).join('') + '</div></div>';
  if (ed) h += '<div class="row wrap"><button class="btn ghost" data-act="gTeamN" data-id="' + g.id + '" data-d="1">' + icon('plus') + 'Equipo</button>' + (teams.length > 2 ? '<button class="btn ghost" data-act="gTeamN" data-id="' + g.id + '" data-d="-1">' + icon('minus') + 'Equipo</button>' : '') + '</div>';
  h += '</section>';
  if (teams.length < 2) return h;
  if (g.teamRank) {
    var ord = g.order || [];
    h += '<section class="card"><h3>Orden de llegada</h3><p class="small muted">' + (ed ? 'Toca los equipos según terminan: el primero que toques es el ganador.' : 'Así van.') + '</p><div class="stack" style="gap:8px">' +
      teams.map(function (t, i) { var p = ord.indexOf(t.id); return '<button class="order-btn tc' + (i % 4 + 1) + (p >= 0 ? ' placed' : '') + '" data-act="gTeamOrder" data-g="' + g.id + '" data-t="' + t.id + '"' + (ed ? '' : ' disabled') + '>' + (p >= 0 ? medal(p + 1) : '<span class="medal">·</span>') + '<b class="grow">' + esc(t.name) + '</b><span class="avs">' + t.members.slice(0, 5).map(function (id) { return eAv(id, 'xs'); }).join('') + '</span></button>'; }).join('') + '</div></section>';
    return h;
  }
  var names = {}; teams.forEach(function (t) { names[t.id] = esc(t.name); });
  h += '<p class="eyebrow">Partidos</p>' + (g.matches || []).map(function (m, i) { return matchHtml(g, 'l:' + i, m, ed, (g.matches.length > 1 ? 'Partido ' + (i + 1) : ''), false, { a: names[m.a], b: names[m.b] }); }).join('');
  if (ed) h += '<button class="btn ghost" data-act="gAddMatch" data-id="' + g.id + '">' + icon('plus') + 'Otro partido (revancha)</button>';
  return h;
}
function rankingInputHtml(g, ed) {

    var id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : null, name = ui.me + '/' + (id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)));
    var opt = { contentType: 'image/jpeg', upsert: false, cacheControl: '3600' };
    return bucket().upload(name + '.jpg', full.blob, opt).then(check)
      .then(function () { return bucket().upload(name + '_t.jpg', thumb.blob, opt).then(check); })
      .then(function () { var row = { path: name + '.jpg', thumb: name + '_t.jpg', person_id: ui.me, day: meta.day, w: full.w, h: full.h }; if (id) row.id = id; return client().from('photos').insert(row).select().single().then(check); })
      .then(function (r) {
        var x = r.data; phCache[x.thumb] = { url: URL.createObjectURL(thumb.blob), exp: Infinity }; phCache[x.path] = { url: URL.createObjectURL(full.blob), exp: Infinity };
        S.photos = S.photos || []; S.photos.push({ id: x.id, path: x.path, thumb: x.thumb, by: x.person_id, day: x.day, caption: '', w: x.w, h: x.h, at: x.created_at });
      });
  };
  PHOTOS.remove = function (ph) { return client().from('photos').delete().match({ id: ph.id }).then(check).then(function () { return bucket().remove([ph.path, ph.thumb]); }); };
  PHOTOS.like = function (ph, on) { var q = client().from('photo_likes'); return (on ? q.insert({ photo_id: ph.id, person_id: ui.me }) : q.delete().match({ photo_id: ph.id, person_id: ui.me })).then(check); };
  PHOTOS.caption = function (ph, txt) { return client().from('photos').update({ caption: txt || null }).match({ id: ph.id }).then(check); };

  return api;
})();

/* Casillas del código: pintar, avanzar solas y entrar al completar las 6 cifras */
function paintPin(inp) {
  var box = inp.closest('.pin'); if (!box) return;
  var v = inp.value, cells = box.querySelectorAll('.pin-cells span');
  cells.forEach(function (c, i) { c.classList.toggle('on', i < v.length); c.classList.toggle('cur', i === Math.min(v.length, 5)); c.setAttribute('data-d', v[i] || ''); });
}
function clearPin(id, focus) { var i = document.getElementById(id); if (!i) return; i.value = ''; paintPin(i); if (focus) setTimeout(function () { i.focus(); }, 30); }
document.addEventListener('input', function (e) {
  var t = e.target; if (!t || !t.classList || !t.classList.contains('pin-in')) return;
  var v = t.value.replace(/\D/g, '').slice(0, 6); if (v !== t.value) t.value = v; paintPin(t);
  if (v.length < 6) return;
  if (t.id === 'lg-code') { if ((val('lg-email') || '').trim()) { t.blur(); A.cloudLogin(); } else { var em = document.getElementById('lg-email'); if (em) em.focus(); toast('Escribe también tu email'); } }
  else if (t.id === 'cs-1') { var n = document.getElementById('cs-2'); if (n) n.focus(); }
  else if (t.id === 'cs-2') { t.blur(); A.cloudSetCode(); }
});
document.addEventListener('focusin', function (e) { var t = e.target; if (t && t.classList && t.classList.contains('pin-in')) paintPin(t); });
A.pinEye = function (el) { var b = el.closest('.pin'); if (b) b.toggleAttribute('data-show'); var i = document.getElementById(el.dataset.id); if (i) i.focus(); };
/* Volver atrás en iOS/Safari puede resucitar una página antigua desde la caché: se recarga para pasar por el acceso */
window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });
/* Intro en el campo de código = Entrar */
document.addEventListener('keydown', function (e) { if (e.key !== 'Enter') return; var t = e.target; if (t && t.id === 'lg-code') A.cloudLogin(); else if (t && t.id === 'lg-email') { var c = document.getElementById('lg-code'); if (c) c.focus(); } else if (t && t.id === 'cs-2') A.cloudSetCode(); });
window.CLOUD = CLOUD;
