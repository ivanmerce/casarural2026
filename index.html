<style>
/* Layout: una columna móvil (máx. 560px) sobre un fondo luminoso con manchas de color y red de nodos; todo el contenido en paneles de cristal esmerilado; barra de pestañas de cristal fija abajo.
   Personalizable por cada persona: tema, color de acento, fondo, intensidad del cristal y tamaño de texto (JS escribe --accent-base, --glass-a, --blur y la escala). */
:root {
  --accent-base: #C4112F;                 /* carmesí del folleto (por defecto) */
  --accent: var(--accent-base);
  --accent-soft: color-mix(in srgb, var(--accent) 13%, transparent);
  --on-accent: #FFFFFF;
  --bg: #F3EEEB;
  --bg-2: #E9E1DC;
  --ink: #1C1614;
  --muted: #6A5E58;
  --line: rgba(60, 35, 28, .12);
  --glass-a: .62;
  --glass: rgba(255, 255, 255, var(--glass-a));
  --glass-strong: rgba(255, 255, 255, calc(var(--glass-a) + .22));
  --glass-line: rgba(255, 255, 255, .75);
  --blur: 18px;
  --surface-2: rgba(120, 85, 60, .08);   /* madera velada */
  --olive: #55663F; --olive-soft: rgba(85, 102, 63, .13);
  --wood: #94643F;
  --ok: #2E7A48; --warn: #A2650F; --warn-soft: rgba(214, 150, 40, .16);
  --blob-1: color-mix(in srgb, var(--accent) 30%, transparent);
  --blob-2: rgba(120, 150, 90, .32);
  --blob-3: rgba(200, 150, 100, .30);
  --net: color-mix(in srgb, var(--accent) 40%, transparent);
  --f1: #C4112F; --f2: #55663F; --f3: #A86A12; --f4: #3F5A7A;
  --overlay-ink: #FFFFFF;
  --shadow: 0 1px 1px rgba(60, 30, 20, .04), 0 10px 30px rgba(60, 30, 20, .08);
  --font-display: 'Bricolage Grotesque', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --r: 22px; --r-sm: 14px;
  --tap: 48px;
  --nav-h: 70px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: color-mix(in srgb, var(--accent-base) 75%, white);
    --bg: #15100F; --bg-2: #1D1614; --ink: #F3ECE8; --muted: #AE9F97; --line: rgba(255, 240, 230, .10);
    --glass: rgba(34, 26, 24, var(--glass-a)); --glass-strong: rgba(40, 30, 28, calc(var(--glass-a) + .25)); --glass-line: rgba(255, 255, 255, .10);
    --surface-2: rgba(255, 220, 190, .06);
    --olive: #A3B880; --olive-soft: rgba(163, 184, 128, .14); --wood: #CF9A6A;
    --ok: #5CC082; --warn: #E3A94A; --warn-soft: rgba(227, 169, 74, .14);
    --blob-1: color-mix(in srgb, var(--accent) 28%, transparent); --blob-2: rgba(110, 140, 80, .22); --blob-3: rgba(160, 110, 70, .22);
    --f1: #EC4A63; --f2: #A3B880; --f3: #E3A94A; --f4: #86A8D0;
    --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: color-mix(in srgb, var(--accent-base) 75%, white);
  --bg: #15100F; --bg-2: #1D1614; --ink: #F3ECE8; --muted: #AE9F97; --line: rgba(255, 240, 230, .10);
  --glass: rgba(34, 26, 24, var(--glass-a)); --glass-strong: rgba(40, 30, 28, calc(var(--glass-a) + .25)); --glass-line: rgba(255, 255, 255, .10);
  --surface-2: rgba(255, 220, 190, .06);
  --olive: #A3B880; --olive-soft: rgba(163, 184, 128, .14); --wood: #CF9A6A;
  --ok: #5CC082; --warn: #E3A94A; --warn-soft: rgba(227, 169, 74, .14);
  --blob-1: color-mix(in srgb, var(--accent) 28%, transparent); --blob-2: rgba(110, 140, 80, .22); --blob-3: rgba(160, 110, 70, .22);
  --f1: #EC4A63; --f2: #A3B880; --f3: #E3A94A; --f4: #86A8D0;
  --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 100%; }
html[data-size="l"] { font-size: 112.5%; }
html[data-size="xl"] { font-size: 125%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
/* Fondo ambiental: manchas de color (cristal) o liso */
.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; background:
  radial-gradient(38rem 30rem at 12% -6%, var(--blob-1), transparent 70%),
  radial-gradient(34rem 28rem at 105% 22%, var(--blob-2), transparent 70%),
  radial-gradient(40rem 30rem at 30% 108%, var(--blob-3), transparent 70%),
  linear-gradient(180deg, var(--bg), var(--bg-2)); }
.ambient canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
html[data-bg="plain"] .ambient { background: var(--bg); }
html[data-bg="plain"] .ambient canvas { display: none; }
html[data-bg="glass"] .ambient canvas { display: none; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 1.6rem; font-weight: 800; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.eyebrow { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.accent { color: var(--accent); }

/* Cristal: base común */
.glass { background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.5); backdrop-filter: blur(var(--blur)) saturate(1.5); border: 1px solid var(--glass-line); box-shadow: var(--shadow); }

/* ---------- Shell ---------- */
.app { max-width: 560px; margin: 0 auto; padding-bottom: calc(var(--nav-h) + 92px + env(safe-area-inset-bottom, 0px)); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px; padding: 8px max(16px, calc(50% - 264px)); margin: 0 auto;
  background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.5); backdrop-filter: blur(var(--blur)) saturate(1.5);
  border-bottom: 1px solid var(--glass-line);
}
.wordmark { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 0; min-height: var(--tap); color: var(--ink); }
.wordmark { gap: 10px; }
.wordmark .mark { width: 40px; height: 40px; flex: none; filter: drop-shadow(0 5px 12px color-mix(in srgb, var(--accent) 38%, transparent)); transition: transform .35s cubic-bezier(.3, 1.5, .5, 1); }
.wordmark .mk-bg { fill: var(--accent); }
.wordmark:active .mark { transform: rotate(-10deg) scale(.92); }
.mk-star { animation: glow 3.6s ease-in-out infinite; }
@keyframes glow { 50% { opacity: .55; } }
@keyframes twinkle { 50% { opacity: .4; transform: scale(.65); } }
.wm-txt { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; text-align: left; }
.wm-txt small { font-size: .6rem; letter-spacing: .26em; text-transform: uppercase; font-weight: 800; color: var(--muted); margin: 1px 0 4px .12em; }
.wm-txt b { font-family: var(--font-display); font-weight: 800; font-size: 1.34rem; letter-spacing: -.025em; color: var(--ink); }
.wm-txt i { font-style: normal; color: var(--accent); }
.wm-txt small:only-child-unused { font-size: 1.1rem; letter-spacing: -.01em; text-transform: none; color: var(--ink); font-family: var(--font-display); margin: 0; }
.topbar .sp { flex: 1; }
.me-btn { display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 4px 12px 4px 4px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass-strong); }
.me-btn .role { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass-strong); }
.ico { width: 22px; height: 22px; flex: none; }

main { padding: 0 16px; }
.view { display: flex; flex-direction: column; gap: 16px; animation: viewIn .3s ease backwards; }
@keyframes viewIn { from { opacity: .35; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 18px; }
.view-head p { margin-top: 4px; }

/* ---------- Hero de cristal con red de nodos ---------- */
.hero { position: relative; margin-top: 14px; padding: 22px 18px 20px; border-radius: 28px; overflow: hidden; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero > *:not(canvas) { position: relative; }
.hero .kicker { color: var(--accent); font-weight: 800; font-family: var(--font-display); font-size: 1.05rem; }
.hero h1 { font-size: clamp(2.3rem, 11vw, 3.4rem); font-weight: 800; margin-top: 6px; letter-spacing: -0.03em; }
.hero h1 span { color: var(--accent); }
.hero .place { color: var(--muted); margin-top: 6px; display: flex; gap: 6px; align-items: center; }
.count { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
.count div { background: var(--glass-strong); border: 1px solid var(--glass-line); border-radius: var(--r-sm); padding: 10px 4px; text-align: center; }
.count b { display: block; font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.count span { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.hero .live { margin-top: 16px; font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; }

/* ---------- Tarjetas ---------- */
.card { border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0;
  background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.5); backdrop-filter: blur(var(--blur)) saturate(1.5);
  border: 1px solid var(--glass-line); box-shadow: var(--shadow); }
.card.alert { background: color-mix(in srgb, var(--warn-soft) 100%, var(--glass)); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.card.star { border: 2px solid color-mix(in srgb, var(--accent) 70%, transparent); }
.card.wood { background: color-mix(in srgb, var(--wood) 9%, var(--glass)); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.link { color: var(--accent); font-weight: 700; text-decoration: none; background: none; border: 0; padding: 6px 0; min-height: 40px; display: inline-flex; align-items: center; gap: 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 > * { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.wrap { flex-wrap: wrap; }
.divider { height: 1px; background: var(--line); }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 18px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass-strong); font-weight: 700; transition: transform .12s ease, background .2s; }
a { color: var(--accent); }
a.btn, a.chip, a.link { color: inherit; text-decoration: none; }
a.btn.accent, a.btn.primary { color: var(--on-accent); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.danger { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: transparent; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; }
.fab { position: fixed; right: max(16px, calc(50% - 264px)); bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 25; width: 60px; height: 60px; border-radius: 20px; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 10px 28px color-mix(in srgb, var(--accent) 45%, transparent); }
.fab .ico { width: 28px; height: 28px; }

/* ---------- Chips, pills, segmentos ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-weight: 600; font-size: .95rem; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.red { background: var(--accent-soft); color: var(--accent); }
.pill.olive { background: var(--olive-soft); color: var(--olive); }
.pill.est { background: transparent; border: 1px dashed var(--warn); color: var(--warn); }
.pill.pend { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.seg { display: flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { flex: 1; min-height: 42px; border: 0; border-radius: 999px; background: transparent; font-weight: 700; font-size: .92rem; color: var(--muted); padding: 0 8px; }
.seg button[aria-pressed="true"] { background: var(--glass-strong); color: var(--ink); box-shadow: var(--shadow); }

/* ---------- Avatares ---------- */
.av { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); font-size: .95rem; color: #fff; background: var(--f1); border: 0; }
.av { overflow: hidden; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
.av.sm { width: 28px; height: 28px; font-size: .78rem; }
.av.lg { width: 48px; height: 48px; font-size: 1.2rem; }
.av.f1 { background: var(--f1); } .av.f2 { background: var(--f2); } .av.f3 { background: var(--f3); } .av.f4 { background: var(--f4); }
.fam-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.fam-dot.f1 { background: var(--f1); } .fam-dot.f2 { background: var(--f2); } .fam-dot.f3 { background: var(--f3); } .fam-dot.f4 { background: var(--f4); }
.avs { display: flex; } .avs .av { margin-left: -7px; box-shadow: 0 0 0 2px var(--bg); } .avs .av:first-child { margin-left: 0; }

/* ---------- Selector de día ---------- */
.days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.day { min-height: 64px; border-radius: var(--r-sm); border: 1px solid var(--glass-line); background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; position: relative; }
.day small { font-weight: 600; color: var(--muted); font-size: .72rem; }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day[aria-pressed="true"] small { color: inherit; opacity: .75; }
.day.star::after { content: ''; position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* ---------- Comidas ---------- */
.meal .slot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.meal .dishes { margin: 0; padding-left: 18px; }
.marc-line { display: flex; gap: 10px; align-items: flex-start; background: var(--olive-soft); border-radius: var(--r-sm); padding: 10px 12px; font-size: .95rem; }
.marc-line b { color: var(--olive); white-space: nowrap; }
.meal-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.diners { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-family: var(--font-display); font-size: 1.1rem; }

/* ---------- Compra ---------- */
.progress { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.cat-head { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.items { display: flex; flex-direction: column; border-radius: var(--r); overflow: hidden;
  background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.5); backdrop-filter: blur(var(--blur)) saturate(1.5); border: 1px solid var(--glass-line); box-shadow: var(--shadow); }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 64px; border-top: 1px solid var(--line); transition: background .3s; }
.item:first-child { border-top: 0; }
.item .body { flex: 1; min-width: 0; background: none; border: 0; text-align: left; padding: 4px 0; }
.item .name { font-weight: 700; display: block; overflow-wrap: anywhere; }
.item .meta { font-size: .84rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.item .price { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem; white-space: nowrap; }
.item .price small { display: block; font-weight: 600; color: var(--warn); font-size: .7rem; letter-spacing: .04em; }
.item.done .name { text-decoration: line-through; text-decoration-color: var(--accent); text-decoration-thickness: 2px; color: var(--muted); }
.item.casa .name { color: var(--muted); }
.check { flex: none; width: 46px; height: 46px; border-radius: 14px; border: 2px solid var(--line); background: var(--glass-strong); display: grid; place-items: center; position: relative; transition: background .2s, border-color .2s; }
.check svg { width: 24px; height: 24px; stroke: var(--on-accent); stroke-width: 3.2; fill: none; stroke-dasharray: 30; stroke-dashoffset: 30; transition: stroke-dashoffset .35s ease .05s; }
.check.on { background: var(--accent); border-color: var(--accent); }
.check.on svg { stroke-dashoffset: 0; }
.check.home { background: var(--olive-soft); border-color: var(--olive); }
.check.home svg { stroke: var(--olive); stroke-dashoffset: 0; }
.check.pop { animation: pop .42s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
.burst { position: absolute; inset: -6px; border-radius: 18px; border: 2px solid var(--accent); animation: burst .5s ease-out forwards; pointer-events: none; }
@keyframes burst { from { opacity: .9; transform: scale(.8); } to { opacity: 0; transform: scale(1.5); } }
.super .item { min-height: 78px; }
.super .item .name { font-size: 1.18rem; }
.search { width: 100%; min-height: var(--tap); border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); padding: 0 18px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

/* ---------- Timeline ---------- */
.tl { position: relative; display: flex; flex-direction: column; gap: 12px; padding-left: 72px; }
.tl::before { content: ''; position: absolute; left: 56px; top: 8px; bottom: 8px; width: 2px; background: repeating-linear-gradient(var(--line) 0 6px, transparent 6px 10px); }
.tl-item { position: relative; }
.tl-time { position: absolute; left: -72px; top: 17px; width: 48px; white-space: nowrap; text-align: right; font-weight: 800; font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size: .9rem; }
.tl-item::before { content: ''; position: absolute; left: -21px; top: 21px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 3px solid var(--accent); }
.tl-item.star::before { background: var(--accent); }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { display: inline-flex; align-items: center; gap: 5px; font-size: .82rem; padding: 4px 9px; border-radius: 8px; background: var(--surface-2); }
.fact .ico { width: 15px; height: 15px; }
.planb { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; color: var(--muted); }
.planb .ico { width: 18px; height: 18px; margin-top: 2px; color: var(--f4); }
.vote { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass-strong); font-weight: 700; }
.vote .ico { width: 18px; height: 18px; }
.vote[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.vote[aria-pressed="true"] .ico { fill: currentColor; }

/* ---------- Torneo ---------- */
.bracket-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px 6px; }
.bracket { display: grid; grid-template-columns: repeat(3, minmax(150px, 1fr)); gap: 14px; min-width: 480px; }
.round { display: flex; flex-direction: column; justify-content: space-around; gap: 12px; }
.round h4 { margin: 0; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.match { border: 1px solid var(--glass-line); border-radius: var(--r-sm); overflow: hidden; background: var(--glass-strong); }
.slotp { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 46px; padding: 6px 8px; border: 0; background: none; text-align: left; font-weight: 600; }
.slotp + .slotp { border-top: 1px solid var(--line); }
.slotp.win { background: var(--accent-soft); color: var(--accent); font-weight: 800; }
.slotp.tbd { color: var(--muted); font-style: italic; }
.slotp .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slotp input { width: 44px; min-height: 34px; text-align: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-variant-numeric: tabular-nums; }
.champ { display: flex; align-items: center; gap: 12px; }
.champ .ico { width: 44px; height: 44px; color: #D39A2A; }

/* ---------- Costes ---------- */
.big { font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .95rem; }
.tbl th { text-align: right; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 6px 4px; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { text-align: right; padding: 10px 4px; border-top: 1px solid var(--line); white-space: nowrap; }
.tbl .pos { color: var(--ok); font-weight: 800; }
.tbl .neg { color: var(--accent); font-weight: 800; }
.tx { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--r-sm); background: var(--surface-2); flex-wrap: wrap; }
.tx .arrow { color: var(--accent); }
.tx .amt { margin-left: auto; font-weight: 800; font-family: var(--font-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.stamp { align-self: center; transform: rotate(-6deg); border: 3px solid var(--ok); color: var(--ok); padding: 6px 14px; border-radius: 10px; font-family: var(--font-display); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; animation: stampIn .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes stampIn { from { transform: rotate(-6deg) scale(2); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }
.pay { display: flex; align-items: center; gap: 12px; }
.pay .when { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 52px; }
details summary { cursor: pointer; font-weight: 700; min-height: 40px; display: flex; align-items: center; }
details ul { margin: 6px 0 0; padding-left: 18px; }

/* ---------- Tiempo ---------- */
.wx { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.wx-day { border-radius: var(--r-sm); background: var(--surface-2); padding: 10px 4px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.wx-day .ico { width: 34px; height: 34px; color: var(--wood); }
.wx-day b { font-family: var(--font-display); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.wx-day small { color: var(--muted); font-size: .74rem; font-variant-numeric: tabular-nums; }
.adv { display: flex; gap: 10px; align-items: flex-start; }
.adv .mark { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .85rem; }
.adv .mark.y { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.adv .mark.n { background: var(--accent-soft); color: var(--accent); }
.adv .mark.i { background: var(--surface-2); color: var(--muted); }

/* ---------- Personas ---------- */
.person { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.person + .person { border-top: 1px solid var(--line); }
.person .grow { flex: 1; min-width: 0; }
.person select { min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass-strong); padding: 0 8px; }
.role-pill.admin { background: var(--ink); color: var(--bg); }
.role-pill.editor { background: var(--olive-soft); color: var(--olive); }
.beds { display: flex; gap: 4px; }
.beds i { width: 16px; height: 10px; border-radius: 3px; background: var(--wood); }
.beds i.free { background: transparent; border: 1.5px dashed var(--wood); }

/* ---------- Confirmación por día ---------- */
.conf-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.conf { min-height: 76px; border-radius: var(--r-sm); border: 2px dashed var(--line); background: var(--glass-strong); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-weight: 700; transition: background .2s, border-color .2s, color .2s; }
.conf small { font-size: .72rem; color: var(--muted); font-weight: 700; }
.conf b { font-family: var(--font-display); font-size: 1.5rem; line-height: 1; }
.conf span { font-size: .74rem; }
.conf.si { border: 2px solid var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--glass-strong)); color: var(--ok); }
.conf.no { border: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); background: var(--accent-soft); color: var(--accent); }
.conf.pend { color: var(--muted); }
.conf.sm { min-height: 46px; border-radius: 12px; }
.conf.sm b { font-size: 1.15rem; }
.conf.pop { animation: pop .42s cubic-bezier(.3, 1.6, .5, 1); }
.daysum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.daysum > div { border-radius: var(--r-sm); background: var(--surface-2); padding: 8px 2px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.daysum > div.star { background: var(--accent-soft); }
.daysum small { font-size: .72rem; font-weight: 700; color: var(--muted); }
.daysum b { font-family: var(--font-display); font-size: 1.7rem; line-height: 1; }
.daysum span { font-size: .66rem; color: var(--muted); white-space: nowrap; }
.conf-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(4, minmax(0, 1fr)); gap: 6px; align-items: center; }
.conf-grid.head small { text-align: center; font-size: .72rem; font-weight: 700; color: var(--muted); }
.conf-legend { display: flex; gap: 14px; flex-wrap: wrap; }
.conf-dot { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; font-size: .75rem; margin-right: 4px; }
.conf-dot.si { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.conf-dot.no { background: var(--accent-soft); color: var(--accent); }
.conf-dot.pend { border: 1.5px dashed var(--muted); color: var(--muted); }

/* ---------- Asistencia ---------- */
.att-fam { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle-p { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 4px 14px 4px 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass-strong); font-weight: 700; }
.toggle-p[aria-pressed="false"] { opacity: .5; text-decoration: line-through; }
.toggle-p[aria-pressed="false"] .av { background: var(--surface-2); color: var(--muted); }

/* ---------- Personalizar ---------- */
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--glass-line); box-shadow: var(--shadow); position: relative; }
.swatch[aria-pressed="true"]::after { content: ''; position: absolute; inset: -7px; border-radius: 50%; border: 2px solid var(--ink); }
.range { width: 100%; accent-color: var(--accent); min-height: 40px; }

/* ---------- Barra inferior ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 0 10px calc(8px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.nav-in { pointer-events: auto; max-width: 540px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); height: var(--nav-h); border-radius: 24px;
  background: var(--glass-strong); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); border: 1px solid var(--glass-line); box-shadow: 0 10px 30px rgba(40, 20, 15, .14); }
.nav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: .74rem; font-weight: 700; color: var(--muted); position: relative; }
.nav button .ico { width: 25px; height: 25px; transition: transform .2s; }
.nav button[aria-current="page"] { color: var(--accent); }
.nav button[aria-current="page"] .ico { transform: translateY(-2px); }
.nav button[aria-current="page"]::before { content: ''; position: absolute; inset: 7px 10%; border-radius: 16px; background: var(--accent-soft); z-index: -1; }

/* ---------- Sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(20, 10, 8, .32); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease both; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .3s cubic-bezier(.2, .9, .3, 1) backwards;
  background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5); border: 1px solid var(--glass-line); }
@keyframes up { from { transform: translateY(40px); opacity: .5; } }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-size: .8rem; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.field input, .field select, .field textarea { min-height: var(--tap); border-radius: 12px; border: 1px solid var(--line); background: var(--glass-strong); padding: 10px 12px; width: 100%; }
.field textarea { min-height: 88px; resize: vertical; }
.sheet-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet-actions .btn { flex: 1; }

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 14px 12px 16px; display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 32px); width: max-content; box-shadow: var(--shadow); animation: toastIn .3s cubic-bezier(.2, .9, .3, 1) both; font-weight: 600; }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 800; min-height: 36px; filter: brightness(1.3); }
@keyframes toastIn { from { transform: translate(-50%, 20px); opacity: 0; } }

/* ---------- Vacíos ---------- */
.empty { text-align: center; padding: 26px 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; color: var(--muted); }
.empty .ico { width: 56px; height: 56px; color: var(--wood); }
.empty b { color: var(--ink); font-family: var(--font-display); font-size: 1.2rem; }

/* ---------- Presencia ---------- */
.online-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 10px 4px 8px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass-strong); font-weight: 800; }
.online-pill .avs .av { box-shadow: 0 0 0 2px var(--glass-strong); }
.av.xs { width: 22px; height: 22px; font-size: .65rem; }
.live-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #2FB463; box-shadow: 0 0 0 0 rgba(47, 180, 99, .6); animation: livePulse 2s infinite; flex: none; }
@keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(47, 180, 99, .55); } 70% { box-shadow: 0 0 0 8px rgba(47, 180, 99, 0); } 100% { box-shadow: 0 0 0 0 rgba(47, 180, 99, 0); } }
.online-list { display: flex; flex-wrap: wrap; gap: 8px; }
.online-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: color-mix(in srgb, #2FB463 12%, var(--glass-strong)); border: 1px solid color-mix(in srgb, #2FB463 35%, transparent); font-weight: 700; }
@media (max-width: 380px) { .me-btn span[style] { display: none !important; } .me-btn { padding-right: 4px; } }

/* ---------- Easter eggs ---------- */
html.disco .ambient { animation: discoHue 1.2s linear infinite; }
html.disco .card, html.disco .hero { animation: discoBeat .6s ease-in-out infinite alternate; }
@keyframes discoHue { to { filter: hue-rotate(360deg) saturate(1.8); } }
.disco-fx { position: fixed; inset: 0; z-index: 78; pointer-events: none; overflow: hidden; animation: fade .4s both; transition: opacity .5s; }
.disco-fx.out { opacity: 0; }
.disco-fx .beams { position: absolute; left: 50%; top: 40px; width: 240vmax; height: 240vmax; margin: -120vmax 0 0 -120vmax;
  background: repeating-conic-gradient(from 0deg, rgba(255, 40, 140, .20) 0 6deg, transparent 6deg 24deg, rgba(40, 200, 255, .20) 24deg 30deg, transparent 30deg 48deg, rgba(255, 210, 40, .22) 48deg 54deg, transparent 54deg 72deg);
  animation: discoSpin 7s linear infinite; }
.disco-fx .beams.b2 { animation-duration: 11s; animation-direction: reverse; opacity: .7; }
.disco-fx .ball { position: absolute; left: 50%; top: 18px; width: 64px; height: 64px; margin-left: -32px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .95), transparent 35%), repeating-conic-gradient(#cfd6de 0 15deg, #f5f7fa 15deg 30deg);
  box-shadow: 0 0 30px rgba(255, 255, 255, .9), 0 0 70px rgba(255, 60, 160, .5); animation: discoSpin 2.5s linear infinite, discoHue 1.2s linear infinite; }
@keyframes discoSpin { to { transform: rotate(360deg); } }
@keyframes discoBeat { from { transform: scale(1); } to { transform: scale(1.012); } }
.sun-overlay { position: fixed; inset: 0; z-index: 79; display: grid; place-items: center; pointer-events: none; background: radial-gradient(circle at 50% 45%, rgba(255, 214, 102, .55), rgba(255, 170, 60, .15) 45%, transparent 70%); animation: fade .4s both; }
.sun-core .ico { width: 190px; height: 190px; color: #F4B400; filter: drop-shadow(0 0 40px rgba(255, 190, 60, .8)); animation: sunSpin 3s linear both; }
@keyframes sunSpin { from { transform: rotate(0) scale(.4); } 30% { transform: rotate(90deg) scale(1.1); } to { transform: rotate(360deg) scale(1); } }
.fx { position: fixed; inset: 0; z-index: 80; pointer-events: none; }
.fx canvas { width: 100%; height: 100%; display: block; }
.egg-veil { position: fixed; inset: 0; z-index: 79; background: rgba(20, 10, 8, .5); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fade .3s both; }
.egg-msg { position: fixed; inset: 0; z-index: 81; display: grid; place-items: center; text-align: center; pointer-events: none; padding: 16px; }
.egg-msg .inner { animation: eggIn .6s cubic-bezier(.3, 1.4, .5, 1) both; }
.egg-msg h2 { font-size: clamp(2.6rem, 14vw, 5rem); color: var(--overlay-ink); text-shadow: 0 4px 30px rgba(0, 0, 0, .45); }
.egg-msg p { color: var(--overlay-ink); font-weight: 700; margin-top: 10px; text-shadow: 0 2px 12px rgba(0, 0, 0, .5); max-width: 32ch; margin-inline: auto; }
.egg-msg .eleven { font-family: var(--font-display); font-weight: 800; font-size: min(62vw, 360px); line-height: .85; color: var(--accent); text-shadow: 0 10px 60px color-mix(in srgb, var(--accent) 50%, transparent); }
@keyframes eggIn { from { transform: scale(.4); opacity: 0; } }
.trophy .ico { width: 150px; height: 150px; color: #E8B64A; filter: drop-shadow(0 8px 30px rgba(232, 182, 74, .55)); animation: spin 1.4s cubic-bezier(.3, 1.4, .5, 1) both; }
@keyframes spin { from { transform: rotateY(540deg) scale(.3); } }
.bubble { position: fixed; z-index: 70; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .85); background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, .95), rgba(160, 200, 255, .28) 40%, rgba(255, 150, 200, .16) 70%, transparent); box-shadow: inset 0 0 12px rgba(255, 255, 255, .5), 0 2px 10px rgba(80, 120, 200, .15); animation: rise linear forwards; }
@keyframes rise { to { transform: translateY(-120vh) translateX(var(--dx, 0)); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :root { --glass: color-mix(in srgb, var(--bg) 92%, white); }
}
.tax-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tax-list .online-chip { background: var(--glass-strong); border-color: var(--line); font-weight: 600; }

/* ===================== Juegos, competición y premios ===================== */
.av.md { width: 40px; height: 40px; font-size: 1rem; }
.av.xl { width: 84px; height: 84px; font-size: 2rem; box-shadow: 0 0 0 4px rgba(255, 255, 255, .85), 0 10px 30px rgba(0, 0, 0, .3); }
.av-duo { display: inline-flex; flex: none; }

.av-duo .av.xs + .av.xs { margin-left: -10px; } .av-duo .av.lg + .av.lg { margin-left: -24px; } .av-duo .av.md + .av.md { margin-left: -18px; } .av-duo .av.xl + .av.xl { margin-left: -40px; }
.av-stack { display: inline-flex; flex: none; }
.av-stack .av + .av { margin-left: -10px; box-shadow: 0 0 0 2px var(--bg); }
.medal { flex: none; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-family: var(--font-display); font-weight: 800; font-size: .85rem; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.medal.g { background: linear-gradient(145deg, #F7D774, #C9971F); color: #3B2A05; }
.medal.s { background: linear-gradient(145deg, #EEF1F4, #A9B2BB); color: #2B3138; }
.medal.b { background: linear-gradient(145deg, #F0C39A, #B06F3C); color: #3A1F0C; }
.pill.live { position: relative; padding-left: 20px; }
.pill.live::before { content: ''; position: absolute; left: 8px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.live-label { display: flex; align-items: center; gap: 8px; color: var(--accent); }

/* lista de juegos */
.game-card { display: flex; flex-direction: row; align-items: center; gap: 12px; text-align: left; font: inherit; color: inherit; width: 100%; cursor: pointer; transition: transform .12s ease; }
.game-card:active { transform: scale(.985); }
.game-card > .ico { color: var(--muted); }
.g-ico { flex: none; width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.g-ico .ico { width: 26px; height: 26px; }
.game-card.st-fin .g-ico { background: color-mix(in srgb, #D39A2A 18%, transparent); color: #B07F17; }
.game-card.st-vivo { border: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); }
.g-body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.g-name { font-family: var(--font-display); font-size: 1.08rem; line-height: 1.15; }
.g-champ { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; }
.g-champ .ico { width: 18px; height: 18px; color: #D39A2A; }
.avs .more { margin-left: 4px; font-size: .75rem; font-weight: 800; color: var(--muted); align-self: center; }
.avs small { margin-left: 8px; align-self: center; }
.comp-card h3 .ico { color: #D39A2A; }
.leader { display: flex; align-items: center; gap: 10px; background: var(--glass-strong); border: 1px solid var(--glass-line); border-radius: var(--r-sm); padding: 10px 12px; text-align: left; font: inherit; color: inherit; width: 100%; }
.leader .eyebrow { display: block; }
.game-mini { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 2px; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; font: inherit; color: inherit; width: 100%; }
.game-mini > .ico:first-child { color: var(--accent); }
.game-mini small { display: block; }

/* ficha de juego */
.g-top { display: flex; align-items: center; gap: 10px; padding-top: 16px; }
.g-top h2 { font-size: clamp(1.35rem, 6vw, 1.8rem); line-height: 1.1; }
.needs { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--warn); color: var(--ink); }
.needs .ico { color: var(--warn); width: 18px; height: 18px; margin-top: 1px; }
.rules summary { cursor: pointer; font-weight: 700; min-height: 40px; display: flex; align-items: center; }
.round-sec { display: flex; flex-direction: column; gap: 10px; }
.round-sec h3 { font-size: 1.05rem; }
.byes { padding: 0 4px; }
.match-card { border-radius: var(--r-sm); background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4); backdrop-filter: blur(var(--blur)) saturate(1.4); border: 1px solid var(--glass-line); box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.match-card > .eyebrow { padding: 4px 8px 0; }
.mt-row { display: flex; align-items: center; gap: 6px; border-radius: 12px; padding: 2px; transition: background .2s; }
.mt-row.win { background: color-mix(in srgb, var(--ok) 14%, transparent); }
.mt-row.win .mt-name { color: var(--ok); }
.mt-row.lose { opacity: .55; }
.mt-name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 4px 8px; border: 0; background: none; font: inherit; font-weight: 700; color: inherit; text-align: left; border-radius: 10px; }
.mt-name .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mt-name:not(:disabled):active { background: var(--surface-2); }
.mt-name .ico { color: var(--ok); }
.stepper { flex: none; display: inline-flex; align-items: center; gap: 2px; background: var(--glass-strong); border: 1px solid var(--line); border-radius: 14px; padding: 2px; }
.stepper button { width: 42px; height: 44px; border: 0; background: none; border-radius: 11px; display: grid; place-items: center; color: var(--ink); }
.stepper button:not(:disabled):active { background: var(--accent-soft); transform: scale(.94); }
.stepper button:disabled { opacity: .35; }
.stepper b { min-width: 30px; text-align: center; font-family: var(--font-display); font-size: 1.35rem; }
.mt-foot { padding: 2px 6px 4px; }
.match-card.done { opacity: .96; }

.teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.team { border-radius: var(--r-sm); padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); border-top: 4px solid var(--tc, var(--muted)); }
.team.loose { border-top-style: dashed; }
.tc1 { --tc: var(--f1); } .tc2 { --tc: var(--f2); } .tc3 { --tc: var(--f3); } .tc4 { --tc: var(--f4); }
.team-name { font: inherit; font-weight: 800; font-family: var(--font-display); border: 0; border-bottom: 1px dashed var(--line); background: none; color: var(--tc, var(--ink)); padding: 4px 0; min-height: 36px; width: 100%; }
.team-m { display: flex; flex-wrap: wrap; gap: 6px; }
.p-chip { min-height: 38px; padding: 0 10px 0 4px; font-weight: 700; font-size: .88rem; background: var(--glass-strong); }
.order-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.order-btn { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; padding: 6px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass-strong); font: inherit; color: inherit; text-align: left; border-left: 5px solid var(--tc, transparent); }
.order-btn.placed { border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.order-btn .ico { color: var(--muted); width: 18px; height: 18px; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
.pick { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 92px; padding: 8px 4px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--glass-strong); font: inherit; font-weight: 700; font-size: .85rem; color: inherit; text-align: center; transition: transform .12s, border-color .2s, background .2s; }
.pick span { line-height: 1.15; }
.pick:not(:disabled):active { transform: scale(.95); }
.pick.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }
.res-row { display: flex; align-items: center; gap: 8px; min-height: 56px; }
.res-row b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-in { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.res-in input { width: 84px; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass-strong); padding: 6px 10px; text-align: right; font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; }
.res-in small { width: 52px; font-size: .75rem; color: var(--muted); }
.st-row, .rk-row { display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 6px 0; border-top: 1px solid var(--line); }
.st-row:first-child, .rk-row:first-child { border-top: 0; }
.rk-row { width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; font: inherit; color: inherit; text-align: left; }
.pts { font-family: var(--font-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.tbl.lg td, .tbl.lg th { text-align: center; } .tbl.lg td:nth-child(2), .tbl.lg th:nth-child(2) { text-align: left; }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.tpl { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 96px; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--glass-strong); font: inherit; color: inherit; text-align: left; }
.tpl .ico { color: var(--accent); width: 26px; height: 26px; }
.tpl small { color: var(--muted); }

/* podio */
.podium-wrap { padding-top: 6px; }
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 8px; }
.pod { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.pod-name { font-family: var(--font-display); font-size: .98rem; line-height: 1.15; overflow-wrap: anywhere; }
.pod-pts { font-size: .8rem; font-weight: 800; color: var(--muted); }
.pod .block { width: 100%; border-radius: 16px 16px 6px 6px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 2rem; color: rgba(0, 0, 0, .55); box-shadow: var(--shadow); }
.pod.p1 .block { height: 118px; background: linear-gradient(160deg, #F7D774, #C9971F); }
.pod.p2 .block { height: 84px; background: linear-gradient(160deg, #EEF1F4, #A9B2BB); }
.pod.p3 .block { height: 62px; background: linear-gradient(160deg, #F0C39A, #B06F3C); }
.pod.empty .block { opacity: .35; }
.pod .crown .ico { width: 30px; height: 30px; color: #D39A2A; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-4px) rotate(-6deg); } }
.pod.p1 .av.lg { width: 64px; height: 64px; box-shadow: 0 0 0 3px #F2CB5B; }

/* premios */
.gala-card { background: linear-gradient(150deg, color-mix(in srgb, #1C1614 88%, var(--accent)), #1C1614); color: #F6EFEA; border-color: rgba(255, 255, 255, .08); }
.gala-card .eyebrow, .gala-card .muted { color: #CDBDB4; }
.gala-card h3 { font-size: 1.6rem; }
.big-btn { min-height: 56px; font-size: 1.05rem; }
.award { gap: 10px; position: relative; }
.aw-ico { flex: none; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, #D39A2A 16%, transparent); color: #B07F17; }
.aw-win { display: flex; flex-wrap: wrap; gap: 8px; }
.aw-w { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px 3px 3px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--line); }
.aw-src { align-self: flex-start; }

/* gala a pantalla completa */
.gala { position: fixed; inset: 0; z-index: 90; background: radial-gradient(120% 80% at 50% 0%, #3A1620, #120B0A 70%); color: #FBF4EF; display: flex; flex-direction: column; animation: fade .35s both; }
.gala-spot { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(40% 55% at 50% 38%, rgba(255, 220, 150, .16), transparent 70%); animation: spot 6s ease-in-out infinite alternate; }
@keyframes spot { to { transform: translateX(8%); } }
.gala-x { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 2; color: #fff; background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .15); }
.gala-in { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 64px 20px 20px; overflow-y: auto; }
.gala-in .eyebrow { color: #E8B64A; }
.gala-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 9.5vw, 3.6rem); line-height: 1.02; letter-spacing: -.02em; max-width: 16ch; animation: eggIn .6s cubic-bezier(.3, 1.4, .5, 1) both; }
.gala-in p { color: #D9CAC1; max-width: 34ch; }
.gala-ico .ico { width: 64px; height: 64px; color: #E8B64A; filter: drop-shadow(0 6px 24px rgba(232, 182, 74, .5)); }
.gala-drum { font-family: var(--font-display); font-size: 1.5rem; color: #fff !important; }
.gala-drum.rolling { animation: shake .12s linear infinite; }
@keyframes shake { 25% { transform: translate(1px, -1px); } 75% { transform: translate(-1px, 1px); } }
.gala-win { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; }
.gw { display: flex; flex-direction: column; align-items: center; gap: 8px; animation: eggIn .7s cubic-bezier(.3, 1.5, .5, 1) both; }
.gw b { font-family: var(--font-display); font-size: 1.3rem; }
.gw .av-duo .av + .av, .gw .av-stack .av + .av { box-shadow: 0 0 0 3px #120B0A; }
.gala-why { font-weight: 700; color: #E8B64A !important; }
.gala-all { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; width: min(640px, 100%); text-align: left; }
.ga { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 10px; border-radius: 14px; background: rgba(255, 255, 255, .07); }
.ga .av { grid-row: span 2; }
.ga small { color: #CDBDB4; font-size: .72rem; line-height: 1.25; }
.gala-ctl { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.gala-ctl .btn:not(.primary) { background: rgba(255, 255, 255, .1); color: #fff; border-color: rgba(255, 255, 255, .15); }
.gala-ctl .btn.primary { min-width: 150px; }
.gala-count { color: #CDBDB4; }

/* ===================== Mobile-first: ajustes para pantallas pequeñas ===================== */
@media (max-width: 400px) {
  main { padding: 0 12px; }
  .nav { padding-left: 6px; padding-right: 6px; }
  .nav button { font-size: .66rem; gap: 2px; }
  .nav button .ico { width: 23px; height: 23px; }
  .topbar { gap: 6px; padding-left: 12px; padding-right: 12px; }
  .wm-txt b { font-size: 1.14rem; } .wm-txt small { font-size: .54rem; letter-spacing: .2em; } .wordmark .mark { width: 36px; height: 36px; }
  .me-btn { padding-right: 8px; }
  .me-btn > span:last-child { display: none !important; }
  .card { padding: 14px; }
  .stepper button { width: 38px; }
  .stepper b { min-width: 24px; font-size: 1.2rem; }
  .mt-name { padding: 4px 4px; gap: 6px; }
  .count b { font-size: 1.6rem; }
  .hero { padding: 18px 14px 16px; }
  .seg button { font-size: .85rem; padding-left: 6px; padding-right: 6px; }

  .res-in input { width: 70px; }

}
@media (max-width: 340px) {
  .nav button span { display: none; }
  .online-pill .avs { display: none; }
}
/* crecer dentro de cualquier fila flexible del módulo de juegos */
.game-card > .grow, .mt-name > .grow, .leader > .grow, .game-mini > .grow, .st-row > .grow, .rk-row > .grow, .res-row > .grow, .order-btn > .grow, .g-top > .grow, .award .row > .grow, .champ > .grow { flex: 1; min-width: 0; }
.avs .av-duo { margin-left: -7px; } .avs .av-duo:first-child { margin-left: 0; }
.avs .av-duo .av { margin-left: 0; box-shadow: 0 0 0 2px var(--bg); } .avs .av-duo .av + .av { margin-left: -12px; }

.pod-avs { display: flex; justify-content: center; } .pod-avs > * + * { margin-left: -14px; }

/* ===================== Compra: lista única, cada familia se pide lo suyo ===================== */
.how { gap: 8px; }
.how-head { display: flex; align-items: center; gap: 10px; min-height: 40px; width: 100%; background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; }
.how-head::after { content: ''; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 4px 4px 0; transition: transform .2s; }
.how.open .how-head::after { transform: rotate(-135deg); margin-bottom: -4px; }
.how-head .muted { margin-left: auto; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: st; display: flex; flex-direction: column; gap: 10px; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 30px 1fr; gap: 10px; font-size: .92rem; }
.steps li::before { content: counter(st); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); }
.claim-demo { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px 1px 5px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: .8rem; vertical-align: 1px; }
.claim-demo .ico { width: 13px; height: 13px; }
.progress.split { display: flex; height: 12px; }
.progress.split i { border-radius: 0; transition: width .5s; }
.progress.split i:first-child { border-radius: 999px 0 0 999px; }
.fb.f1 { background: var(--f1); } .fb.f2 { background: var(--f2); } .fb.f3 { background: var(--f3); } .fb.f4 { background: var(--f4); }
.fam-bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 6px; }
.fam-bar { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; align-items: center; column-gap: 6px; min-height: 52px; padding: 6px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass-strong); font: inherit; color: inherit; text-align: left; }
.fam-bar b { font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fam-bar .num { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
.fam-bar small { grid-column: 2 / 4; font-size: .72rem; }
.fam-bar.libre { grid-column: 1 / -1; grid-template-columns: auto 1fr auto; border-style: dashed; border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.fam-bar.libre .num { color: var(--accent); }
.fam-dot.none { background: transparent; border: 2px dashed var(--muted); width: 11px; height: 11px; }
.item.free { background: color-mix(in srgb, var(--accent) 3%, transparent); }
.check.free-dot { border-style: dashed; color: var(--muted); font-weight: 800; font-family: var(--font-display); font-size: 1.1rem; background: transparent; }
.item .price { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.owner { border: 0; border-radius: 999px; padding: 4px 10px; min-height: 30px; font: inherit; font-size: .76rem; font-weight: 800; color: #fff; background: var(--f1); }
.owner.f1 { background: var(--f1); } .owner.f2 { background: var(--f2); } .owner.f3 { background: var(--f3); } .owner.f4 { background: var(--f4); }
.owner.mine { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px currentColor; color: #fff; }
.claim { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 14px 0 10px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 800; font-size: .86rem; box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 30%, transparent); transition: transform .12s; }
.claim .ico { width: 16px; height: 16px; }
.claim:active { transform: scale(.94); }
.item.claimed { animation: claimed .4s ease forwards; }
@keyframes claimed { to { opacity: .2; transform: translateX(24px); } }
@media (max-width: 400px) { .claim { padding: 0 10px 0 7px; font-size: .8rem; } .item { gap: 8px; padding: 10px 8px; } .check { width: 42px; height: 42px; } }

/* ===================== Álbum ===================== */
.cam-btn { width: 42px; height: 42px; color: var(--ink); }
.cam-btn[aria-current="page"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.ph-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-radius: var(--r-sm); overflow: hidden; }
.ph-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; border-radius: 12px; overflow: hidden; }
.ph { position: relative; display: block; aspect-ratio: 1; padding: 0; border: 0; background: var(--surface-2); overflow: hidden; cursor: zoom-in; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
.ph:active img { transform: scale(.96); }
.ph-likes { position: absolute; right: 5px; bottom: 5px; display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px 2px 5px; border-radius: 999px; background: rgba(0, 0, 0, .55); color: #fff; font-size: .72rem; font-weight: 800; }
.ph-likes .ico { width: 12px; height: 12px; }
.ph-wait { display: block; width: 100%; height: 100%; background: linear-gradient(100deg, var(--surface-2) 30%, color-mix(in srgb, var(--surface-2) 40%, #fff) 50%, var(--surface-2) 70%); background-size: 300% 100%; animation: shimmer 1.4s linear infinite; }
.ph-wait.big { width: min(80vw, 420px); height: 50vh; border-radius: 12px; }
@keyframes shimmer { to { background-position: -150% 0; } }
.up-card .btn { min-height: 54px; font-size: 1.02rem; }
.viewer { position: fixed; inset: 0; z-index: 95; background: rgba(8, 5, 4, .96); color: #fff; display: flex; flex-direction: column; animation: fade .25s both; }
.vw-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 8px; }
.vw-who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.vw-who b { display: block; } .vw-who small { display: block; color: #CDBDB4; font-size: .75rem; }
.viewer .icon-btn { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .15); color: #fff; }
.vw-stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
.vw-img { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.vw-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
.vw-nav { position: absolute; top: 50%; margin-top: -24px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .14); color: #fff; display: grid; place-items: center; z-index: 1; }
.vw-nav.prev { left: 8px; } .vw-nav.next { right: 8px; } .vw-nav:disabled { opacity: 0; pointer-events: none; }
.vw-bot { padding: 10px 14px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
.vw-cap { font-size: 1rem; text-align: center; }
.vw-actions { justify-content: center; }
.vw-actions .btn:not(.primary):not(.danger) { background: rgba(255, 255, 255, .12); color: #fff; border-color: rgba(255, 255, 255, .15); }
@media (max-width: 400px) { .cam-btn { width: 38px; height: 38px; } .ph-strip { grid-template-columns: repeat(3, 1fr); } }

.gala-card .btn:not(.primary) { background: rgba(255, 255, 255, .1); color: #fff; border-color: rgba(255, 255, 255, .18); }
.aw-pend { gap: 0; }
.aw-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.aw-row:nth-child(2) { border-top: 0; }
.aw-row .grow { flex: 1; min-width: 0; } .aw-row b { display: block; font-size: .95rem; } .aw-row small { display: block; font-size: .8rem; line-height: 1.3; }
.aw-ico.sm { width: 34px; height: 34px; border-radius: 11px; } .aw-ico.sm .ico { width: 18px; height: 18px; }
.aw-row .icon-btn { width: 40px; height: 40px; }

/* ===================== Acceso (v0.5) ===================== */
.login-card { margin-top: 22px; gap: 14px; padding: 22px 18px; }
.login-mark .mark { width: 64px; height: 64px; filter: drop-shadow(0 8px 20px color-mix(in srgb, var(--accent) 40%, transparent)); }
.login-mark .mk-bg { fill: var(--accent); }
.login-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 9vw, 2.6rem); line-height: 1.02; letter-spacing: -.03em; }
.login-title i { font-style: normal; color: var(--accent); }
.pin { position: relative; }
.pin-in { position: absolute; inset: 0; width: 100% !important; height: 100% !important; min-height: 0 !important; padding: 0 !important; border: 0 !important; background: transparent !important; color: transparent !important; -webkit-text-fill-color: transparent; caret-color: transparent; font-size: 16px !important; letter-spacing: 0; z-index: 1; outline: none; }
.pin-in::selection { background: transparent; }
.pin-cells { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; padding-right: 50px; pointer-events: none; }
.pin-cells span { height: 58px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--glass-strong); display: grid; place-items: center; transition: border-color .15s, box-shadow .15s, transform .15s; }
.pin-cells span.on::after { content: ''; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); animation: pinIn .18s ease; }
.pin[data-show] .pin-cells span.on::after { content: attr(data-d); width: auto; height: auto; border-radius: 0; background: none; font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; color: var(--ink); }
.pin:focus-within .pin-cells span.cur { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
@keyframes pinIn { from { transform: scale(.3); opacity: 0; } }
.pin-eye { position: absolute; right: 0; top: 50%; margin-top: -21px; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass-strong); display: grid; place-items: center; color: var(--muted); z-index: 2; }
.pin[data-show] .pin-eye { color: var(--accent); border-color: var(--accent); }
@media (max-width: 360px) { .pin-cells { gap: 5px; } .pin-cells span { height: 50px; } }
.first-time { padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); }
.login-msg { color: var(--accent); font-weight: 700; }
.code-st { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); align-items: center; }
.code-st.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
.code-st .grow { color: var(--ink); font-size: .9rem; }
.shared-code { padding: 8px 12px; border-radius: 14px; background: var(--glass-strong); border: 1px dashed var(--line); }
.access-card { border: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); }

/* botón de cerrar en todas las hojas */
.sheet { position: relative; }
.sheet-x { position: absolute; top: 10px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass-strong); display: grid; place-items: center; color: var(--muted); z-index: 2; }
.sheet-x .ico { width: 18px; height: 18px; }
.sheet > h2:first-of-type { padding-right: 48px; }

/* ===================== Manual ===================== */
.manual-cta { display: flex; flex-direction: row; align-items: center; gap: 12px; text-align: left; font: inherit; color: inherit; width: 100%; padding: 12px 14px; }
.manual-cta b { display: block; } .manual-cta small { display: block; font-size: .8rem; }
.manual-cta > .grow, .man-step > .grow, .manual-dl .grow { flex: 1; min-width: 0; }
.man-steps { gap: 10px; }
.man-step { flex-direction: row; align-items: flex-start; gap: 12px; }
.man-n { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; }
.man-step h3, .man-card h3 { font-size: 1.05rem; margin-bottom: 4px; }
.man-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.man-card { gap: 6px; }
.man-dark { background: #1C1614; color: #F3ECE8; border-color: rgba(255, 255, 255, .08); }
.man-tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.man-tips b { font-family: var(--font-display); } .man-tips .gold { color: #F6CD62; } .man-tips p { color: #D9CAC1; margin-top: 4px; }
@media print {
  @page { size: A4; margin: 12mm; }
  html, body { background: #fff !important; }
  .ambient, .topbar, .nav, .fab, .toast, .manual-dl, #onlineSlot, .scrim { display: none !important; }
  .app { max-width: none; padding: 0; }
  .card { box-shadow: none !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; background: #fff !important; border: 1px solid #ddd !important; break-inside: avoid; }
  .man-dark { background: #1C1614 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .man-n { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .view { animation: none !important; gap: 10px; }
  .man-grid { grid-template-columns: 1fr 1fr; }
}

/* precio real en línea (Lo nuestro) */
.item .price.price-edit { flex-direction: column; align-items: flex-end; gap: 6px; }
.price-in { display: inline-flex; align-items: center; gap: 4px; padding: 0 10px 0 4px; min-height: 44px; border-radius: 12px; border: 2px dashed color-mix(in srgb, var(--warn) 70%, transparent); background: var(--glass-strong); }
.price-in input { width: 74px; border: 0; background: transparent; font: inherit; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; text-align: right; padding: 6px 2px; color: var(--ink); font-size: 16px; }
.price-in input::placeholder { color: var(--muted); font-weight: 600; font-size: .9rem; }
.price-in span { font-weight: 800; color: var(--muted); }
.price-in.ok { border-style: solid; border-color: color-mix(in srgb, var(--ok) 55%, transparent); background: color-mix(in srgb, var(--ok) 8%, var(--glass-strong)); }
.price-in.ok span { color: var(--ok); }
.casa-tag { font-size: .8rem; font-weight: 800; color: var(--olive); }
.price-prog { display: flex; flex-direction: column; align-items: flex-end; } .price-prog b { font-family: var(--font-display); font-size: 1.3rem; } .price-prog small { color: var(--muted); font-size: .72rem; }
.ok-txt { color: var(--ok); font-weight: 700; }
.mine-sum { gap: 8px; }

/* v0.5.7 · Rincón de los abuelos y bote */
.card.abu { background: linear-gradient(160deg, color-mix(in srgb, var(--wood) 14%, var(--glass)), color-mix(in srgb, var(--olive) 10%, var(--glass))); border-color: color-mix(in srgb, var(--wood) 35%, var(--glass-line)); }
.card.abu h3 { font-size: 1.25rem; line-height: 1.15; }
.abu-meter { display: grid; gap: 6px; padding: 12px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--glass-line); }
.abu-meter .bar { height: 10px; border-radius: 999px; background: var(--olive-soft); overflow: hidden; }
.abu-meter .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--olive), var(--wood)); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.abu-inv { background: none; border: 0; border-bottom: 1px dashed var(--glass-line); text-align: left; font: inherit; color: inherit; padding: 8px 0; min-height: 44px; width: 100%; }
.abu-form { display: grid; gap: 8px; }
.abu-form .chips { margin: 0; padding: 2px 0; flex-wrap: wrap; overflow: visible; }
.abu-form .price-in { min-height: 42px; }
.abu-form .price-in input { width: 70px; }
.pot { display: grid; gap: 4px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); }
.pot .row { min-height: 28px; }
.pot .olive-t { color: var(--olive); }
.pot .pot-total { border-top: 1px solid var(--glass-line); padding-top: 6px; margin-top: 2px; }
.abu-form .price-in { border: 1px solid var(--glass-line); }

/* v0.5.8 · Secretos: ranking, pistas y alarma */
@keyframes eggPoke { 0% { transform: scale(1); } 40% { transform: scale(.94) rotate(-2deg); } 100% { transform: scale(1); } }
.egg-poke { animation: eggPoke .28s ease; }
[data-egg] { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.hero h1[data-egg] { cursor: default; user-select: none; -webkit-user-select: none; }
.sec-mission { padding: 10px 12px; gap: 6px; }
.sec-me { display: grid; gap: 8px; padding: 12px; border-radius: var(--r-sm); background: var(--surface-2); }
.sec-me .big small { font-size: .5em; color: var(--muted); font-weight: 700; }
.sec-me .bar, .sec-row .bar { height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.sec-me .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold, #E8B64A)); border-radius: inherit; }
.sec-rank { display: grid; gap: 4px; }
.sec-row { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 10px; border-radius: 12px; }
.sec-row.me { background: var(--accent-soft); }
.sec-row .num { font-weight: 800; }
.sec-egg .sec-more { display: flex; gap: 6px; align-items: flex-start; margin-top: 4px; padding: 6px 8px; border-radius: 10px; background: color-mix(in srgb, var(--gold, #E8B64A) 16%, transparent); }
.sec-egg .sec-more .ico { flex: none; width: 16px; height: 16px; margin-top: 2px; }
.sec-hint { min-height: 40px; padding: 0 10px; flex: none; }
.sec-hint.armed { border-color: var(--accent); color: var(--accent); font-size: .85rem; }
.sec-banner { display: flex; align-items: center; gap: 12px; text-align: left; font: inherit; color: inherit; border-color: color-mix(in srgb, var(--accent) 45%, var(--glass-line)); background: color-mix(in srgb, var(--accent) 10%, var(--glass)); animation: secPulse 2.4s ease-in-out infinite; }
.sec-banner small { display: block; color: var(--muted); }
@keyframes secPulse { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft); } 50% { box-shadow: 0 0 0 8px transparent; } }
.sec-alarm { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 16px; background: rgba(12, 8, 8, .62); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fadeIn .25s ease; }
.sec-alarm-in { width: min(420px, 100%); display: grid; gap: 10px; text-align: center; padding: 22px 18px; border-radius: 22px; background: var(--bg); border: 2px solid var(--accent); box-shadow: 0 20px 60px rgba(0,0,0,.4); }
.sec-alarm-in h2 { font-size: clamp(1.8rem, 8vw, 2.4rem); }
.sec-bell { width: 64px; height: 64px; margin: 0 auto; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: #fff; animation: bell 1s ease-in-out infinite; }
.sec-bell .ico { width: 34px; height: 34px; }
@keyframes bell { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(14deg); } 40% { transform: rotate(-12deg); } 60% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } }
@media (prefers-reduced-motion: reduce) { .sec-banner, .sec-bell, .egg-poke { animation: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.split-how { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-sm); background: var(--olive-soft); }
.split-how .aw-ico { flex: none; }

/* v0.5.9 · Mensajes de secretos legibles, al momento y que se cierran con un toque */
button, a, [data-act], [data-egg] { touch-action: manipulation; }
.egg-msg { pointer-events: auto; cursor: pointer; }
.egg-msg .inner { width: min(400px, 100%); display: grid; gap: 8px; justify-items: center; padding: 22px 20px 16px; border-radius: 24px; background: rgba(20, 14, 16, .88); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, .14); box-shadow: 0 24px 70px rgba(0, 0, 0, .45); }
.egg-msg h2 { font-size: clamp(1.9rem, 8.5vw, 2.6rem) !important; line-height: 1.05; color: #fff; text-shadow: none; }
.egg-msg p { color: #F1E9E4; font-weight: 600; font-size: 1.02rem; line-height: 1.4; text-shadow: none; margin: 0; max-width: 34ch; }
.egg-msg .eleven { font-size: min(34vw, 170px) !important; }
.egg-msg .trophy { margin-bottom: 2px; }
.egg-badge { display: inline-block; padding: 5px 12px; border-radius: 999px; background: var(--gold, #E8B64A); color: #1C1614; font-weight: 800; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; }
.egg-hush { color: #BFB3AD; font-size: .8rem; }
.egg-tap { color: #8F827C; font-size: .72rem; margin-top: 2px; }

/* v0.6 · La finca */
.finca-card { gap: 12px; }
.wifi { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: inherit; padding: 12px; border-radius: var(--r-sm); border: 1px dashed var(--glass-line); background: var(--surface-2); min-height: 56px; }
.wifi small { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
.wifi b { font-size: 1.02rem; }
.wifi-pass { text-align: right; }
.reg { display: grid; gap: 8px; }
.reg-list { display: flex; flex-wrap: wrap; gap: 6px; }
.reg-p[aria-pressed="true"] { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--glass)); }
.reg-p span.small { color: var(--muted); }
.finca-ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.finca-ul li { line-height: 1.45; }
.shop { text-decoration: none; color: inherit; padding: 8px 0; min-height: 48px; border-bottom: 1px dashed var(--glass-line); }
a.fact { color: inherit; text-decoration: none; }
.reg-p[aria-pressed="false"] { opacity: 1; text-decoration: none; }
.reg-p[aria-pressed="false"] .av { background: inherit; color: inherit; }
.reg-p[aria-pressed="false"] span.small { color: var(--warn); font-weight: 700; }
.reg-p[aria-pressed="true"] span.small { color: var(--ok); font-weight: 700; }

/* v0.6.3 · ¿Dónde dormimos? */
.casas-card { gap: 10px; }
.my-room { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 12px 14px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--hc) 14%, var(--glass)); border: 2px solid color-mix(in srgb, var(--hc) 55%, transparent); }
.my-room-house { grid-column: 1; font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--hc); }
.my-room b { grid-column: 1; font-family: var(--font-display); font-size: 1.35rem; line-height: 1.1; }
.my-room .small { grid-column: 1; }
.my-room .avs { grid-column: 2; grid-row: 1 / span 3; display: flex; }
.my-room .avs .av + .av { margin-left: -8px; box-shadow: 0 0 0 2px var(--bg); }
.casas-pend { display: flex; gap: 6px; align-items: flex-start; color: var(--warn); }
.casas-pend .ico { flex: none; margin-top: 2px; }
.chip.mini { min-height: 34px; padding: 0 10px; font-size: .82rem; margin: 2px 2px 0 0; }
.plan-wrap { overflow-x: auto; margin: 0 -16px; padding: 4px 16px 8px; }
.plan { position: relative; width: 100%; min-width: 340px; border-radius: 18px; background: repeating-linear-gradient(45deg, var(--surface-2) 0 6px, transparent 6px 12px), var(--glass); border: 1px solid var(--glass-line); }
.plan-house { position: absolute; border: 3px solid var(--hc); border-radius: 10px; background: color-mix(in srgb, var(--hc) 7%, var(--bg)); }
.plan-hname { position: absolute; left: 6px; bottom: -3px; transform: translateY(100%); font-family: var(--font-display); font-weight: 800; font-size: clamp(.62rem, 2.6vw, .9rem); color: var(--hc); white-space: nowrap; }
.plan-room { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 2px; border-radius: 6px; font-size: clamp(.5rem, 2vw, .72rem); text-align: center; line-height: 1.05; color: var(--muted); border: 1px dashed color-mix(in srgb, var(--hc) 35%, var(--glass-line)); background: color-mix(in srgb, var(--hc) 5%, transparent); overflow: hidden; }
.plan-room.k-kitchen, .plan-room.k-dining, .plan-room.k-living { background: color-mix(in srgb, var(--hc) 12%, transparent); font-weight: 700; }
.plan-room.bed { cursor: pointer; font: inherit; color: var(--ink); background: var(--bg); border: 2px solid color-mix(in srgb, var(--hc) 70%, transparent); box-shadow: 0 2px 8px rgba(0,0,0,.08); transition: transform .15s; }
.plan-room.bed:active { transform: scale(.96); }
.plan-room.bed.empty { border-style: dashed; background: color-mix(in srgb, var(--warn) 10%, var(--bg)); }
.plan-room.bed.mine { outline: 3px solid var(--accent); outline-offset: 1px; box-shadow: 0 0 0 6px var(--accent-soft); }
.plan-rname { font-weight: 800; font-size: clamp(.5rem, 2vw, .72rem); }
.pdots { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
.pdot .av.xs { width: clamp(14px, 4.4vw, 22px); height: clamp(14px, 4.4vw, 22px); font-size: .5rem; }
.pdot.baby .av.xs { width: clamp(11px, 3.2vw, 16px); height: clamp(11px, 3.2vw, 16px); outline: 1.5px dashed var(--hc); }
.pdot.free { width: clamp(14px, 4.4vw, 22px); height: clamp(14px, 4.4vw, 22px); border-radius: 50%; border: 2px dashed var(--warn); }
.plan-note { position: absolute; left: 2%; bottom: 3%; width: 50%; font-size: clamp(.5rem, 1.9vw, .7rem); color: var(--muted); line-height: 1.25; }
.plan-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); }
.plan-legend span { display: inline-flex; align-items: center; gap: 6px; }
.plan-legend .ico { width: 16px; height: 16px; }
.lg-free { width: 14px; height: 14px; border-radius: 50%; border: 2px dashed var(--warn); display: inline-block; }
.lg-mine { width: 14px; height: 14px; border-radius: 4px; outline: 3px solid var(--accent); display: inline-block; }
